<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investor Pipeline</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #151a2d; --muted: #66708a; --line: #e3e6ef;
    --accent: #2f5bea; --good: #1c7c4d; --warn: #b26a00; --bad: #b3261e; --chip: #eef1f9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1220; --card: #181c30; --text: #e8ebf7; --muted: #98a1bf; --line: #2a3050;
            --accent: #7b9bff; --good: #5fd49a; --warn: #f0b04a; --bad: #ff8a80; --chip: #232845; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .banner { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--card); margin-bottom: 8px; }
  .banner.warn { border-color: var(--warn); } .banner.bad { border-color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .row { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
  .firm { font-weight: 650; font-size: 16px; }
  .score { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
  .why { margin: 6px 0 0; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
  .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); } .chip.good { color: var(--good); }
  .ev { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; font-size: 14px; }
  .ev q { color: var(--muted); display: block; font-size: 13px; margin: 2px 0 4px; }
  a { color: var(--accent); }
  button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--text);
           border-radius: 8px; padding: 2px 9px; cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  details { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .quiet { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 16px; font-size: 14px; }
  .empty { color: var(--muted); padding: 8px 0; }
  #gate { max-width: 360px; margin: 20vh auto; padding: 0 16px; }
  input { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--card); color: var(--text); margin: 8px 0; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const GROUPS = [
  ["reach_out", "Reach out this week", "Fresh signal, not yet contacted. Ranked by score."],
  ["nudge", "Nudge", "Waiting on a reply and there is a reason to follow up."],
  ["hold", "Hold", "You already moved recently. Let it breathe."],
];
const app = document.getElementById("app");

// Everything from the database (including model-written summaries) is untrusted text: build DOM, never innerHTML.
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k === "onclick") n.onclick = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
}
const safeUrl = (u) => { try { const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:" ? x.href : null; } catch { return null; } };
const fmtDate = (d) => d ? new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "never";
const daysAgo = (d, now) => Math.floor((now - new Date(d)) / 864e5);

function runBanners(run, vcs, now) {
  const out = [];
  if (!run) return [el("div", { class: "banner warn" }, "The job has not run yet.")];
  const finished = run.finished_at ? new Date(run.finished_at) : null;
  const age = finished ? daysAgo(finished, now) : null;
  const when = finished ? `${finished.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })} (${age}d ago)` : "still running";
  const stale = age != null && age > 4;
  out.push(el("div", { class: "banner" + (stale || run.status !== "ok" ? " warn" : "") },
    `Last run: ${when}. Status: ${run.status}. ${run.vcs_checked}/${run.vcs_total} checked, ${run.signals_kept} signals kept, ${run.signals_dropped} dropped by validation.`,
    stale ? " This is older than the usual 3-4 day cycle: the scheduled run may have started late or failed. Re-run it from GitHub Actions." : ""));
  const failed = vcs.filter((v) => v.check_ok === false);
  if (failed.length) out.push(el("div", { class: "banner bad" }, `${failed.length} VC${failed.length > 1 ? "s" : ""} could not be checked last run, so their scores below are from an earlier run: ${failed.map((v) => v.firm).join(", ")}.`));
  if (run.error) out.push(el("div", { class: "banner bad" }, `Run error: ${run.error}`));
  return out;
}

async function sendFeedback(ev, useful, btns) {
  const r = await fetch("/api/feedback", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ evidence_id: ev.id, vc_id: ev.vc_id, useful }) });
  if (r.ok) btns.forEach(([b, v]) => b.classList.toggle("on", v === useful));
  else alert("Could not save feedback.");
}

function card(v, evidence, now) {
  const checked = v.checked_at ? daysAgo(v.checked_at, now) : null;
  const chips = [
    el("span", { class: "chip" }, v.status.replace("_", " ")),
    el("span", { class: "chip" }, v.geo),
    v.check_ok === false ? el("span", { class: "chip bad" }, "check failed: showing old values")
      : checked == null ? el("span", { class: "chip warn" }, "never checked")
      : el("span", { class: "chip" + (checked > 5 ? " warn" : "") }, `checked ${checked}d ago`),
    v.last_contacted_at ? el("span", { class: "chip" }, `contacted ${fmtDate(v.last_contacted_at)}`) : null,
    v.flag ? el("span", { class: "chip warn" }, v.flag) : null,
  ];
  const evs = evidence.filter((e) => e.vc_id === v.id).map((e) => {
    const href = safeUrl(e.url);
    const up = el("button", { class: e.useful === true ? "on" : "" }, "Useful");
    const down = el("button", { class: e.useful === false ? "on" : "" }, "Not useful");
    const btns = [[up, true], [down, false]];
    up.onclick = () => sendFeedback(e, true, btns); down.onclick = () => sendFeedback(e, false, btns);
    return el("div", { class: "ev" },
      el("span", { class: "chip" }, e.type.replace(/_/g, " ")), " ", fmtDate(e.published_date), " · ", e.summary,
      el("q", {}, e.quote),
      href ? el("a", { href, target: "_blank", rel: "noopener noreferrer" }, "Check the source") : null, " ", up, " ", down);
  });
  const notes = null;
  return el("div", { class: "card" },
    el("div", { class: "row" }, el("span", { class: "firm" }, v.firm), el("span", { class: "score" }, v.follow_up_score ?? "–")),
    el("p", { class: "why" }, v.signal_summary || "Not scored yet."),
    el("div", { class: "meta" }, chips), evs, notes);
}

function render(data) {
  const now = new Date(data.now);
  const byAction = (a) => data.vcs.filter((v) => v.recommended_action === a).sort((x, y) => (y.follow_up_score ?? 0) - (x.follow_up_score ?? 0));
  const parts = [el("h1", {}, "Who to reach out to this week"),
    el("p", { class: "sub" }, "Signals from the last 30 days. Every one links to its source: check it before you cite it."), ...runBanners(data.run, data.vcs, now)];
  for (const [key, title, hint] of GROUPS) {
    const list = byAction(key);
    parts.push(el("h2", {}, `${title} (${list.length})`));
    parts.push(list.length ? list.map((v) => card(v, data.evidence, now)) : el("div", { class: "empty" }, key === "reach_out" ? "Nothing fresh this week. See the quiet list below, and don't force it." : hint));
  }
  const quiet = byAction("quiet_list");
  parts.push(el("h2", {}, `Quiet: don't spend energy here (${quiet.length})`),
    el("div", { class: "quiet" }, quiet.map((v) => el("div", {}, v.firm, v.check_ok === false ? " ⚠" : ""))));
  const skipped = byAction("skip");
  parts.push(el("h2", {}, `Skipped: not a fit right now (${skipped.length})`),
    el("div", { class: "quiet" }, skipped.map((v) => el("div", { title: v.signal_summary || "" }, `${v.firm}: ${(v.signal_summary || "").replace("Skipped: ", "")}`))));
  const unscored = data.vcs.filter((v) => !v.recommended_action).length;
  if (unscored) parts.push(el("p", { class: "sub" }, `${unscored} VCs have not been scored yet.`));
  app.replaceChildren(...parts.flat());
}

async function load() {
  app.replaceChildren(el("p", { class: "sub" }, "Loading..."));
  try {
    const r = await fetch("/api/pipeline");
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    app.replaceChildren(el("p", { class: "banner bad" }, "Could not load the pipeline. Try again in a minute."));
  }
}
load();
</script>
</body>
</html>
