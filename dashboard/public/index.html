<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investor Pipeline</title>
<style>
  :root {
    --bg: #0a0a0f; --panel: #14141b; --panel2: #1b1b24; --line: #262633; --text: #f3f3f7; --muted: #a9a9be;
    --purple: #7b5cff; --purple2: #b07bff; --green: #4ade80; --pink: #ff5fa2; --blue: #5b8cff; --amber: #f5b14a; --red: #ff7a7a;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 24px 20px 72px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .logo { width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, var(--purple), var(--purple2)); }
  h1 { font: 700 28px/1.1 var(--mono); margin: 0 0 6px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0; }
  .sub b { color: var(--text); font-weight: 600; }
  .hero { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: 14px; margin-bottom: 30px; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
  .insight { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .insight.bad { border-color: #5a2a2a; }
  .insight h3 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--pink); display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: #200; flex: none; }
  .insight p { margin: 0 0 12px; color: #c9c9d6; font-size: 13px; }
  .kpi { border-radius: 16px; padding: 16px; background: linear-gradient(135deg, #6b4df0 0%, #a46cf5 100%); display: grid; gap: 14px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; opacity: .9; margin-bottom: 6px; }
  .track { height: 8px; border-radius: 99px; background: rgba(255,255,255,.28); overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; background: #fff; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } }
  .tile { background: rgba(255,255,255,.16); border-radius: 12px; padding: 12px 14px; }
  .tile small { display: block; font-size: 12px; opacity: .85; }
  .tile strong { font: 700 22px/1.3 var(--mono); }
  .tile em { font-style: normal; font-size: 12px; opacity: .85; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
  .chip.good { color: var(--green); background: rgba(74,222,128,.1); border-color: rgba(74,222,128,.25); }
  .chip.warn { color: var(--amber); } .chip.bad { color: var(--red); }
  h2 { font: 600 18px var(--mono); margin: 0 0 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h2 small { font: 400 12px system-ui; color: var(--muted); }
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) { .board { grid-template-columns: 1fr; } }
  .col h4 { margin: 0 0 10px; font: 600 14px var(--mono); display: flex; justify-content: space-between; color: var(--text); }
  .col h4 span { color: var(--muted); font-weight: 400; }
  .col .hint { color: var(--muted); font-size: 12px; margin: -4px 0 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .card .name { font-weight: 650; font-size: 15px; }
  .card .meta { color: var(--muted); font-size: 12px; }
  .amount { font: 700 26px/1.2 var(--mono); margin: 8px 0 6px; }
  .pl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .pbar { height: 6px; border-radius: 99px; background: var(--panel2); overflow: hidden; }
  .pbar i { display: block; height: 100%; border-radius: 99px; }
  .why { margin: 10px 0 0; color: #cfcfdb; font-size: 13px; }
  .age { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .ev { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; font-size: 12px; }
  .ev q { display: block; color: var(--muted); margin: 3px 0 6px; }
  a { color: #9db6ff; }
  button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 8px; padding: 2px 9px; cursor: pointer; }
  button:hover { border-color: var(--purple); }
  button.on { background: var(--purple); border-color: var(--purple); }
  .mini { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; font-size: 13px; }
  .mini span:last-child { color: var(--muted); font-size: 12px; text-align: right; }
  .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; font-size: 13px; }
  .skipped { margin-top: 30px; }
  a.vclink { color: var(--text); text-decoration: none; }
  a.vclink:hover { color: #b9a7ff; text-decoration: underline; }
  .back { display: inline-block; margin-bottom: 14px; color: var(--muted); text-decoration: none; font-size: 13px; }
  .back:hover { color: var(--text); }
  .ph { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 18px; }
  .ph h1 { margin-bottom: 10px; }
  .big { font: 700 44px/1 var(--mono); }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 860px) { .pgrid { grid-template-columns: 1fr; } }

  th { color: var(--muted); font-weight: 500; border-top: 0; }
  .chip.c-green { color: #4ade80; background: rgba(74,222,128,.12); border-color: rgba(74,222,128,.32); }
  .chip.c-amber { color: #f5b14a; background: rgba(245,177,74,.12); border-color: rgba(245,177,74,.32); }
  .chip.c-blue { color: #7aa7ff; background: rgba(91,140,255,.13); border-color: rgba(91,140,255,.34); }
  .chip.c-purple { color: #b9a4ff; background: rgba(123,92,255,.15); border-color: rgba(123,92,255,.38); }
  .chip.c-teal { color: #3ddbd9; background: rgba(61,219,217,.11); border-color: rgba(61,219,217,.3); }
  .chip.c-red { color: #ff8a8a; background: rgba(255,122,122,.12); border-color: rgba(255,122,122,.32); }
  .chip.c-gray { color: #b8b8cc; }
  .board.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 1250px) { .board.five { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 800px) { .board.five { grid-template-columns: 1fr; } }
  .chip { white-space: nowrap; }
  .notice { border: 1px solid #5a2a2a; background: rgba(255,122,122,.07); color: #ffb3b3; border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 10px; }
  .insight.best { display: flex; flex-direction: column; gap: 8px; }
  .insight.best .row { align-items: center; flex-wrap: nowrap; }
  .insight.best h3 { margin: 0; }
  .insight.best p { margin: 0; }
  .bestname { font: 700 24px/1.2 var(--mono); }
  .bestname a { color: var(--text); text-decoration: none; }
  .bestname a:hover { color: #b9a7ff; }
  .insight.best .score { font: 700 28px var(--mono); color: var(--green); }
  .dot.ok { background: var(--green); }
  .insight.best a.more { margin-top: auto; }
  .row { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
  .card.compact { padding: 10px 12px; margin-bottom: 8px; }
  .card.compact .row { align-items: center; flex-wrap: nowrap; gap: 8px; }
  .card.compact .name { font-size: 14px; }
  .pts { font: 700 16px var(--mono); flex: none; }
  .why.one { margin: 6px 0 0; font-size: 12.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.compact .qa { margin-top: 8px; }
  .card.compact .qa button { padding: 1px 8px; }
  button.showall { width: 100%; margin-top: 4px; padding: 6px; color: var(--muted); }
  .board.auto { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .sk { background: linear-gradient(90deg, var(--panel) 25%, var(--panel2) 50%, var(--panel) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 12px; }
  @keyframes sh { to { background-position: -200% 0; } }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #04210f; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 9; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  .runline { font-size: 12px; color: rgba(255,255,255,.85); }
  .kpi h3 { margin: 0; font: 600 15px var(--mono); }
  .tile.click { cursor: default; }
  .tile strong { font-size: 26px; }
  details.sec { margin-top: 26px; }
  details.sec > summary { cursor: pointer; font: 600 16px var(--mono); list-style: none; display: flex; gap: 10px; align-items: baseline; }
  details.sec > summary::before { content: "\25b8"; color: var(--muted); }
  details.sec[open] > summary::before { content: "\25be"; }
  details.sec > summary small { font: 400 12px system-ui; color: var(--muted); }
  .sec input.filter { margin: 12px 0 10px; width: 260px; max-width: 100%; font: inherit; font-size: 13px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .quiet.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 14px; }
  .emptyline { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
  .card.compact .meta { margin-top: 4px; font-size: 12px; }
  .pts { font-size: 18px; }
  .qa button.primary { padding: 4px 12px; font-weight: 600; }
  ul.bullets { margin: 10px 0 0; padding-left: 18px; max-width: 680px; color: var(--muted); font-size: 14px; }
  ul.bullets li { margin-bottom: 4px; }
  .tiles.four { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 560px) { .tiles.four { grid-template-columns: repeat(2, 1fr); } }
  .namerow { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .namerow h1 { margin: 0; }
  .vlogo { width: 52px; height: 52px; border-radius: 13px; flex: none; }
  img.vlogo { background: #fff; object-fit: contain; padding: 7px; }
  .vlogo.initials { display: grid; place-items: center; background: linear-gradient(135deg, var(--purple), var(--purple2)); color: #fff; font: 700 18px var(--mono); }
  button.seemore { margin-top: 4px; color: var(--muted); }
  .hero { align-items: stretch; }
  .kpi { align-content: space-between; }
  .tile.click { cursor: pointer; transition: background .15s; }
  .tile.click:hover { background: rgba(255,255,255,.26); }
  .legend { font-size: 12px; color: var(--muted); margin: -14px 0 22px; }
  .legend b { font-weight: 600; }
  .warnbox { border: 1px solid rgba(245,177,74,.45); background: rgba(245,177,74,.08); color: #f7c97a; border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
  .statusblock { min-width: 210px; text-align: right; }
  .statusblock .big { font-size: 22px; }
  .statusblock .sub2 { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .next { margin-top: 6px; font-size: 12.5px; color: #dcdcf0; }
  .card.compact .meta.warn { color: #f7c97a; }
  .toast { display: flex; align-items: center; gap: 12px; }
  .toastbtn { background: rgba(0,0,0,.18); border: 0; color: #04210f; font-weight: 700; padding: 3px 10px; border-radius: 7px; cursor: pointer; }
  .toastbtn:hover { background: rgba(0,0,0,.3); }
  .fitnote { color: var(--muted); font-size: 12.5px; margin: -6px 0 14px; }
  details.notice > summary { cursor: pointer; list-style: none; }
  details.notice > summary::before { content: "\25b8  "; }
  details.notice[open] > summary::before { content: "\25be  "; }
  details.notice p { margin: 6px 0 0 14px; color: #f0b9b9; font-size: 12.5px; }
  button.linkbtn { border: 0; background: none; color: #b9a7ff; padding: 0 0 0 8px; font-size: 12px; cursor: pointer; text-decoration: underline; }
  button.delbtn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; float: right; }
  button.delbtn:hover { color: var(--red); }
  .tabs { display: flex; gap: 6px; margin: 0 0 18px; }
  .tabs a { padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); text-decoration: none; font-size: 13px; }
  .tabs a.on { background: var(--purple); border-color: var(--purple); color: #fff; }
  .tier-legacy_unverified { color: var(--red); border-color: rgba(255,122,122,.4); }
  .form { display: grid; gap: 8px; }
  .form label { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
  .form input, .form select, .form textarea { font: inherit; font-size: 13px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
  .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button.primary { background: var(--purple); border-color: var(--purple); padding: 6px 14px; font-size: 13px; }

  .tl small { color: var(--muted); }

  .tier-own_site { color: var(--green); } .tier-news { color: var(--blue); } .tier-social { color: var(--amber); }
</style>

<body>
<main id="app"></main>
<script>
const app = document.getElementById("app");
const show = (...nodes) => app.replaceChildren(...nodes.flat(Infinity).filter((n) => n != null && n !== false));

// Everything from the database (including model-written summaries) is untrusted text: build DOM, never innerHTML.
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k === "onclick") n.onclick = v; else if (k === "style") n.style.cssText = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
}
const safeUrl = (u) => { try { const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:" ? x.href : null; } catch { return null; } };
const fmtDate = (d) => d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }) : "never";
// Dates are the user's LOCAL calendar days. A date-only value ("2026-10-12") is a calendar day, so it is compared
// to today's local date, not to a UTC timestamp; a timestamp is compared by elapsed time.
const localIso = (daysBack = 0) => { const t = new Date(); t.setDate(t.getDate() - daysBack); return t.toLocaleDateString("en-CA"); };
const isDateOnly = (d) => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d);
const daysAgo = (d, now) => {
  if (isDateOnly(d)) {
    const [y, m, dd] = d.split("-").map(Number);
    const a = new Date(y, m - 1, dd), b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.max(0, Math.round((b - a) / 864e5));
  }
  return Math.max(0, Math.floor((now - new Date(d)) / 864e5));
};
const label = (s) => String(s || "").replace(/_/g, " ");
const LBL = {
  status: { to_contact: "Prospect", waiting: "Contacted", in_conversation: "In talks", approved: "Approved", closed: "Closed", declined: "Declined" },
  action: { reach_out: "Reach out now", nudge: "Follow up", hold: "Hold", quiet_list: "Dormant", skip: "Not a fit" },
  type: { portfolio_investment: "New investment", fund_announcement: "Fund news", interview: "Interview", blog_post: "Blog post", event_appearance: "Event / talk", other: "Other" },
};
const COL = {
  status: { to_contact: "purple", waiting: "amber", in_conversation: "blue", approved: "green", closed: "green", declined: "red" },
  action: { reach_out: "green", nudge: "amber", hold: "blue", quiet_list: "gray", skip: "red" },
  type: { portfolio_investment: "green", fund_announcement: "purple", interview: "blue", blog_post: "teal", event_appearance: "amber", other: "gray" },
};
const BUCKET = {
  reach: ["Reach out", "green"], nudge: ["Follow up due", "amber"], waiting: ["Contacted", "blue"], talks: ["In talks", "blue"],
  approved: ["Approved", "green"], declined: ["Declined", "red"], dormant: ["Dormant", "gray"], skip: ["Not a fit", "red"],
};
const btag = (b) => el("span", { class: `chip c-${BUCKET[b][1]}` }, BUCKET[b][0]);
const relChip = (e) => e.relevance === "logistics" ? el("span", { class: "chip c-green" }, "Logistics") : e.relevance ? el("span", { class: "chip c-gray" }, "General activity") : null;
const tag = (kind, v) => v ? el("span", { class: `chip c-${COL[kind][v] || "gray"}` }, LBL[kind][v] || label(v)) : null;
const scoreColor = (s) => s >= 70 ? "var(--green)" : s >= 40 ? "var(--blue)" : "var(--pink)";

async function sendFeedback(ev, useful, btns) {
  try {
    const r = await fetch("/api/feedback", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ evidence_id: ev.id, vc_id: ev.vc_id, useful }) });
    if (!r.ok) throw new Error(r.status);
    btns.forEach(([b, v]) => b.classList.toggle("on", v === useful));
  } catch { alert("Could not save feedback."); }
}

const TIER = { own_site: "Firm's own site", news: "News / press", social: "Social post", unlisted: "Unlisted source", legacy_unverified: "Unverified source" };
function trustChip(e) {
  return e.source_tier ? el("span", { class: `chip tier-${e.source_tier}` }, `${TIER[e.source_tier] || e.source_tier}: ${e.source_domain}`) : null;
}

// ---- one set of rules for where an investor belongs. Driven by YOUR status and dates, so logging
// ---- an action moves the card immediately; scores and signals still come from the last run.
const NUDGE_DAYS = 7;        // keep in step with routing.waiting_nudge_days in weights.yaml
const MIN_REACH = 35;        // keep in step with routing.reach_out_min_score
const MAX_SIGNAL_AGE = 14;   // keep in step with routing.reach_out_max_signal_age_days

const waitDays = (v, now) => v.last_contacted_at ? daysAgo(v.last_contacted_at, now) : null;
// Investors with a logistics signal fresh enough to justify a cold approach.
const hotSet = (evidence, now) => new Set(evidence.filter((e) => e.relevance === "logistics" && e.source_tier !== "legacy_unverified" && daysAgo(e.published_date, now) <= MAX_SIGNAL_AGE).map((e) => e.vc_id));
const friendlyError = (e) => /gemini|empty response|json/i.test(e || "") ? "The AI step failed" : /exa|search|http|network/i.test(e || "") ? "The search service was unavailable" : "The check did not finish";

function bucketOf(v, now, hot) {
  let status = v.status;
  const revisitDue = status === "declined" && v.revisit_on && v.revisit_on <= localIso(0);
  if (revisitDue) status = "to_contact";
  if (status === "declined") return "declined";
  if (status === "approved" || status === "closed") return "approved";
  if (status === "in_conversation") return "talks";
  if (status === "waiting") { const d = waitDays(v, now); return d == null || d >= NUDGE_DAYS ? "nudge" : "waiting"; }
  if (v.recommended_action === "skip" && !revisitDue) return "skip";
  return v.recommended_action === "reach_out" && (v.follow_up_score ?? 0) >= MIN_REACH && hot.has(v.id) ? "reach" : "dormant";
}

function groupVcs(data, now) {
  const hot = hotSet(data.evidence, now);
  const g = { reach: [], nudge: [], waiting: [], talks: [], approved: [], declined: [], dormant: [], skip: [] };
  for (const v of data.vcs) g[bucketOf(v, now, hot)].push(v);
  const byFirm = (a, b) => a.firm.localeCompare(b.firm);
  g.reach.sort((a, b) => (a.check_ok === false) - (b.check_ok === false) || (b.follow_up_score ?? 0) - (a.follow_up_score ?? 0));
  g.nudge.sort((a, b) => (waitDays(b, now) ?? 999) - (waitDays(a, now) ?? 999));          // longest silence first
  g.waiting.sort((a, b) => (waitDays(b, now) ?? 0) - (waitDays(a, now) ?? 0));
  g.talks.sort((a, b) => (b.last_contacted_at || "") < (a.last_contacted_at || "") ? -1 : 1);
  for (const k of ["approved", "declined", "dormant", "skip"]) g[k].sort(byFirm);
  return g;
}

function signalsOf(v, evidence) {
  const all = evidence.filter((e) => e.vc_id === v.id && e.source_tier !== "legacy_unverified")
    .sort((a, b) => (b.relevance === "logistics") - (a.relevance === "logistics") || (a.published_date < b.published_date ? 1 : -1));
  return { all, best: all[0] };
}

// A toast, optionally with an Undo button that stays for a few seconds longer.
function toast(text, undo) {
  const t = el("div", { class: "toast" }, text);
  let timer;
  if (undo) {
    const b = el("button", { class: "toastbtn" }, "Undo");
    b.onclick = async () => { clearTimeout(timer); t.remove(); await undo(); };
    t.append(b);
  }
  document.body.append(t);
  timer = setTimeout(() => t.remove(), undo ? 9000 : 2600);
}

// After any logged action: confirm it, and offer to put everything back exactly as it was.
function savedToast(v, res, text, reload) {
  toast(text, res && res.id ? async () => {
    if (await editCall({ action: "undo_log", vc_id: v.id, interaction_id: res.id, prev: res.prev })) { toast("Undone"); reload(); }
  } : null);
}

// One-click actions that make sense for where the investor is.
function quickActions(v, bucket) {
  const reload = () => load(undefined, true);
  const make = (text, body, primary) => {
    const b = el("button", { class: primary ? "primary" : "" }, text);
    b.onclick = async () => {
      b.disabled = true; b.textContent = "Saving\u2026";
      const res = await editCall({ vc_id: v.id, ...(body.action === "log" ? { occurred_on: localIso(0) } : {}), ...body });
      if (res) { savedToast(v, res, `${v.firm}: ${text}`, reload); reload(); }
      else { b.disabled = false; b.textContent = text; }
    };
    return b;
  };
  // "Next step" opens a small inline field on the card.
  const nextStep = (box) => {
    const b = el("button", {}, "Next step");
    b.onclick = () => {
      const input = el("input", { placeholder: "e.g. send the deck by Friday", maxlength: "200", style: "flex:1;min-width:150px" }); input.value = v.next_step || "";
      const save = el("button", { class: "primary" }, "Save"), cancel = el("button", {}, "Cancel");
      const row = el("div", { class: "qa", style: "width:100%" }, input, save, cancel);
      save.onclick = async () => { if (await editCall({ action: "next_step", vc_id: v.id, next_step: input.value })) { toast("Next step saved"); reload(); } };
      cancel.onclick = () => row.replaceWith(box);
      box.replaceWith(row); input.focus();
    };
    return b;
  };
  const log = (kind, extra = {}) => ({ action: "log", kind, ...extra });
  const sets = {
    reach: [["Mark reached out", log("reached_out"), true]],
    nudge: [["Followed up", log("follow_up"), true], ["They replied", log("replied")]],
    waiting: [["They replied", log("replied")]],
    talks: [["They approved", log("approved")], "NEXT"],
    approved: v.status === "closed"
      ? ["NEXT", ["Undo: back to approved", log("note", { status: "approved", note: "Closed undone: back to approved" })]]
      : [["Mark closed", log("closed"), true], "NEXT", ["Undo approval", log("note", { status: "in_conversation", note: "Approval undone: back to in talks" })]],
    declined: [["Revisit in 6 months", { action: "revisit" }], ["Undo decline", { action: "undo_decline" }]],
  };
  if (!sets[bucket]) return null;
  const box = el("div", { class: "qa" });
  box.append(...sets[bucket].map((e) => (e === "NEXT" ? nextStep(box) : make(e[0], e[1], e[2]))));
  return box;
}

function card(v, evidence, now, bucket) {
  const { all, best } = signalsOf(v, evidence), score = v.follow_up_score ?? 0, d = waitDays(v, now);
  const due = v.last_contacted_at ? fmtDate(new Date(new Date(v.last_contacted_at).getTime() + NUDGE_DAYS * 864e5).toISOString()) : null;
  const meta = {
    nudge: d == null ? "Contacted \u00b7 no date recorded \u00b7 no reply" : `Contacted ${d}d ago \u00b7 no reply`,
    waiting: `Contacted ${d}d ago \u00b7 follow up on ${due}`,
    talks: d == null ? "In talks" : `In talks \u00b7 last contact ${d}d ago`,
    approved: (v.status === "closed" ? "Deal closed" : "Committed to invest") + (d == null ? "" : ` \u00b7 last contact ${d}d ago`),
    declined: (d == null ? "Declined" : `Declined ${d}d ago`) + (v.revisit_on ? ` \u00b7 revisit ${fmtDate(v.revisit_on)}` : ""),
  }[bucket] || null;
  const showSignal = bucket === "reach" && best;
  return el("div", { class: "card compact" },
    el("div", { class: "row" }, el("a", { class: "vclink name", href: `#/vc/${v.id}` }, v.firm),
      bucket === "reach" ? el("span", { class: "pts", style: `color:${scoreColor(score)}`, title: "Follow-up score: 70+ strong, 40-69 medium, under 40 weak" }, String(score))
        : bucket === "nudge" ? el("span", { class: "chip c-amber" }, d == null ? "overdue" : `${d} days`) : null),
    meta ? el("div", { class: "meta" }, meta) : null,
    v.next_step && ["nudge", "waiting", "talks", "approved"].includes(bucket) ? el("div", { class: "next" }, "Next: " + v.next_step) : null,
    showSignal || (v.check_ok === false && bucket === "reach") ? el("div", { class: "chips", style: "margin-top:6px" },
      showSignal ? [tag("type", best.type), relChip(best), el("span", { class: "chip" }, `${daysAgo(best.published_date, now)}d ago`),
        el("span", { class: "chip" }, `${all.length} signal${all.length > 1 ? "s" : ""}`)] : null,
      v.check_ok === false && bucket === "reach" ? el("span", { class: "chip c-red", title: "The last check failed, so this is older data" }, "stale") : null) : null,
    showSignal ? el("p", { class: "why one" }, best.summary) : null,
    quickActions(v, bucket));
}

function miniRow(v, text) {
  return el("div", { class: "mini", "data-name": v.firm.toLowerCase() }, el("span", {}, el("a", { class: "vclink", href: `#/vc/${v.id}` }, v.firm), v.check_ok === false ? " \u26a0" : ""), el("span", {}, text));
}

// ---- top panel: what to do first, and the counts that matter
function pickFocus(g) {
  const fresh = (v) => v.check_ok !== false;
  const n = g.nudge.find(fresh); if (n) return { v: n, bucket: "nudge" };
  const r = g.reach.find(fresh); if (r) return { v: r, bucket: "reach" };
  return null;
}

function hero(data, now, g, focus) {
  const { run, vcs, evidence } = data;
  // Only prospects care: a failed check just means an older score, which doesn't matter once you've contacted them.
  const failed = vcs.filter((v) => v.check_ok === false && v.status === "to_contact");
  const finished = run && run.finished_at ? new Date(run.finished_at) : null;
  const age = finished ? daysAgo(finished, now) : null;
  const notices = [];
  const failedNote = failed.length ? el("details", { class: "notice" }, el("summary", {}, `${failed.length} prospect${failed.length > 1 ? "s" : ""} couldn't be checked last run`),
    el("p", {}, `${failed.map((v) => v.firm).join(", ")}. Their earlier results are shown and marked stale until the next run.`)) : null;
  if (run && run.error) notices.push(/credit/i.test(run.error) ? "Search credits ran out during the last run. Top up Exa, then re-run it from GitHub Actions. Previous results were kept." : "The last run hit an error. Previous results were kept.");
  if (age != null && age > 4) notices.push(`The last run finished ${age} days ago, older than the usual 3-4 day cycle. Re-run it from GitHub Actions.`);

  let insight;
  if (focus) {
    const v = focus.v, { best } = signalsOf(v, evidence), d = waitDays(v, now);
    const title = focus.bucket === "nudge" ? "Do this first: follow up" : "Do this first: reach out";
    const line = focus.bucket === "nudge" ? `Contacted ${d == null ? "a while ago" : d + " days ago"} with no reply. ` : "";
    insight = el("div", { class: "insight best" },
      el("div", { class: "row" }, el("h3", {}, el("span", { class: "dot ok" }, "1"), title),
        focus.bucket === "reach" && v.follow_up_score ? el("span", { class: "score", title: "Follow-up score" }, String(v.follow_up_score)) : null),
      el("div", { class: "bestname" }, el("a", { class: "vclink", href: `#/vc/${v.id}` }, v.firm)),
      el("p", {}, line, best ? best.summary : ""),
      best ? el("div", { class: "chips" }, tag("type", best.type), relChip(best), trustChip(best)) : null,
      quickActions(v, focus.bucket),
      el("a", { class: "more", href: `#/vc/${v.id}` }, "Open profile and all signals \u2192"));
  } else {
    insight = el("div", { class: "insight" }, el("h3", {}, el("span", { class: "dot" }, "0"), "Nothing to act on"),
      el("p", {}, "No one is due a follow-up and no prospect has a recent logistics signal. Don't force it."));
  }

  const when = age == null ? (run ? "running" : "never") : age === 0 ? "today" : `${age}d ago`;
  const tile = (small, n, em, target) => {
    const t = el("div", { class: "tile click", title: "Jump to this list" }, el("small", {}, small), el("strong", {}, String(n)), " ", el("em", {}, em));
    t.onclick = () => { const c = document.getElementById("col-" + target); if (c) c.scrollIntoView({ behavior: "smooth", block: "start" }); };
    return t;
  };
  const kpi = el("div", { class: "kpi" },
    el("h3", {}, "Your pipeline today"),
    el("div", { class: "tiles four" },
      tile("Reach out", g.reach.length, "prospects", "reach"), tile("Follow up due", g.nudge.length, "no reply", "nudge"),
      tile("In talks", g.talks.length, "live", "talks"), tile("Approved", g.approved.length, "committed", "approved")),
    el("div", { class: "runline" }, run ? `Last run ${when}: ${run.vcs_checked}/${run.vcs_total} investors checked, ${run.signals_kept} signals kept.` : "No run yet."));
  return [failedNote, ...notices.map((t) => el("div", { class: "notice" }, t)), el("div", { class: "hero" }, insight, kpi)];
}

function column(title, hint, items, o = {}) {
  const { limit, total, id, empty } = o;
  const head = el("h4", {}, title, el("span", {}, String(total ?? items.length)));
  const sub = hint ? el("div", { class: "hint" }, hint) : null;
  const attrs = { class: "col", id: id ? "col-" + id : undefined };
  if (!id) delete attrs.id;
  if (!items.length) return el("div", attrs, head, sub, el("div", { class: "empty" }, empty || "Nothing here."));
  if (!limit || items.length <= limit) return el("div", attrs, head, sub, items);
  // Long lists show the top few; the rest are one click away.
  const rest = el("div", { style: "display:none" }, items.slice(limit));
  const btn = el("button", { class: "showall" }, `Show all ${items.length}`);
  btn.onclick = () => { const open = rest.style.display === "none"; rest.style.display = open ? "block" : "none"; btn.textContent = open ? "Show top " + limit : `Show all ${items.length}`; };
  return el("div", attrs, head, sub, items.slice(0, limit), rest, btn);
}

// ---- collapsible, filterable list for the long tail
function listSection(title, hint, vs, textFn) {
  if (!vs.length) return null;
  const rows = vs.map((v) => miniRow(v, textFn(v)));
  const box = el("input", { class: "filter", placeholder: `Filter ${vs.length} investors` });
  box.oninput = () => { const q = box.value.trim().toLowerCase(); rows.forEach((r) => { r.style.display = r.dataset.name.includes(q) ? "" : "none"; }); };
  return el("details", { class: "sec" }, el("summary", {}, title, el("small", {}, `${vs.length} \u00b7 ${hint}`)), box, el("div", { class: "quiet cols" }, rows));
}

// No login: the site is meant to be private (Vercel Deployment Protection).
async function editCall(body) {
  try {
    const r = await fetch("/api/edit", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ today: localIso(0), ...body }) });
    if (r.ok) return await r.json().catch(() => ({ ok: true }));
    alert(r.status === 403 ? "Editing is not switched on yet (DASHBOARD_ED_URL is missing in Vercel)." : "Could not save.");
  } catch { alert("Could not save."); }
  return false;
}

function tabs(active) {
  return el("div", { class: "tabs" }, el("a", { href: "#/", class: active === "action" ? "on" : "" }, "By action"),
    el("a", { href: "#/status", class: active === "status" ? "on" : "" }, "My pipeline"));
}

function header(data, active) {
  return [el("div", { class: "brand" }, el("span", { class: "logo" }), "Investor Pipeline"),
    el("div", { class: "top" }, el("div", {},
      el("h1", {}, active === "action" ? "What to do today" : "My pipeline"),
      el("p", { class: "sub" }, el("b", {}, `${data.vcs.length} investors`), active === "action"
        ? " tracked \u00b7 follow-ups and new prospects \u00b7 every claim links to its source"
        : " by stage: who to approach, who's contacted, who's talking, who said yes or no"))),
    tabs(active)];
}

const skeleton = () => [el("div", { class: "sk", style: "height:26px;width:240px;margin-bottom:18px" }),
  el("div", { class: "hero" }, el("div", { class: "sk", style: "height:170px" }), el("div", { class: "sk", style: "height:170px" })),
  el("div", { class: "board auto" }, [0, 1, 2].map(() => el("div", {}, [0, 1, 2].map(() => el("div", { class: "sk", style: "height:104px;margin-bottom:8px" })))))];

function render(data) {
  const now = new Date(), g = groupVcs(data, now), focus = pickFocus(g);
  const lists = Object.fromEntries(Object.entries(g).map(([k, vs]) => [k, focus && focus.bucket === k ? vs.filter((v) => v.id !== focus.v.id) : vs]));
  const above = (k) => (focus && focus.bucket === k ? " \u00b7 top one is above" : "");
  const defs = [
    ["reach", "Reach out", `Logistics signal in the last ${MAX_SIGNAL_AGE} days${above("reach")}`, { limit: 10, id: "reach" }],
    ["nudge", "Follow up due", `Contacted ${NUDGE_DAYS}+ days ago, no reply${above("nudge")}`, { id: "nudge", always: true, empty: g.nudge.length ? "Just the one above." : "Nothing due. Nobody is overdue a reply." }],
    ["waiting", "Contacted", "Waiting for a reply; follow-up date shown", { id: "waiting" }],
    ["talks", "In talks", "Replied, call or meeting", { id: "talks" }],
    ["approved", "Approved", "Committed to invest", { id: "approved" }],
    ["declined", "Declined", "Said no. Revisit or undo from here", { id: "declined" }],
  ];
  const shown = defs.filter(([k, , , o]) => lists[k].length || o.always);
  const none = defs.filter(([k, , , o]) => !g[k].length && !o.always).map(([, t]) => t);
  const unscored = data.vcs.filter((v) => !v.recommended_action).length;

  show(...header(data, "action"),
    hero(data, now, g, focus),
    el("p", { class: "legend" }, el("b", {}, "Score: "), "70+ strong \u00b7 40\u201369 medium \u00b7 under 40 weak. Based on recent logistics signals, how fresh and how reliable the source is."),
    el("div", { class: "board auto" }, shown.map(([k, title, hint, o]) =>
      column(title, hint, lists[k].map((v) => card(v, data.evidence, now, k)), { ...o, total: g[k].length }))),
    none.length ? el("p", { class: "emptyline" }, `Nothing in: ${none.join(", ")}.`) : null,
    listSection("Dormant", "no recent logistics signal, nothing to do", g.dormant, (v) => v.check_ok === false ? "check failed" : v.stage_focus),
    listSection("Not a fit", "filtered out by the fit rules", g.skip, (v) => (v.signal_summary || "").replace("Skipped: ", "")),
    unscored ? el("p", { class: "sub", style: "margin-top:20px" }, `${unscored} investors have not been scored yet.`) : null);
}

function renderStatus(data) {
  const now = new Date(), g = groupVcs(data, now);
  const contacted = [...g.nudge, ...g.waiting];     // follow-ups due first
  const cols = [
    ["Reach out", `Logistics signal in the last ${MAX_SIGNAL_AGE} days`, g.reach.map((v) => card(v, data.evidence, now, "reach")), { limit: 10 }, g.reach.length],
    ["Contacted", "Overdue follow-ups first", contacted.map((v) => card(v, data.evidence, now, bucketOf(v, now, new Set()))), {}, contacted.length],
    ["In talks", "Replied, call or meeting", g.talks.map((v) => card(v, data.evidence, now, "talks")), {}, g.talks.length],
    ["Approved", "Committed to invest", g.approved.map((v) => card(v, data.evidence, now, "approved")), {}, g.approved.length],
    ["Declined", "Said no. Revisit or undo from here", g.declined.map((v) => card(v, data.evidence, now, "declined")), {}, g.declined.length],
  ];
  const shown = cols.filter((c) => c[4]), none = cols.filter((c) => !c[4]).map((c) => c[0]);
  show(...header(data, "status"),
    shown.length ? el("div", { class: "board auto" }, shown.map(([t, h, items, o, total]) => column(t, h, items, { ...o, total }))) : null,
    none.length ? el("p", { class: "emptyline" }, `Nothing yet in: ${none.join(", ")}.`) : null,
    el("p", { class: "emptyline" }, `${g.dormant.length} prospects have no recent logistics signal (see Dormant on By action) and ${g.skip.length} aren't a fit (see Not a fit).`));
}

// Logo: the firm's favicon, from its website when we know it. If there is none (or it fails to load) fall back to initials.
function logoFor(v) {
  const initials = (v.firm.replace(/\(.*?\)/g, "").match(/[A-Za-z0-9]+/g) || ["?"]).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
  const fallback = () => el("div", { class: "vlogo initials", "aria-hidden": "true" }, initials);
  let host = null;
  try { host = v.website ? new URL(v.website.includes("//") ? v.website : "https://" + v.website).hostname.replace(/^www\./, "") : null; } catch { host = null; }
  if (!host) return fallback();
  const img = el("img", { class: "vlogo", alt: "", width: "52", height: "52", referrerpolicy: "no-referrer",
    src: `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=128` });
  img.onerror = () => img.replaceWith(fallback());
  return img;
}

// Before you approach: a warning. Once you're talking: a quiet note. Once they've said no: nothing.
function fitNote(v, bucket) {
  if (!v.flag || bucket === "declined") return null;
  if (["reach", "dormant", "skip"].includes(bucket)) return el("div", { class: "warnbox" }, el("b", {}, "Check the fit before you reach out. "), `${v.flag}. Their focus: ${v.thesis}.`);
  return el("div", { class: "fitnote" }, `Fit note: ${v.flag}. Their focus: ${v.thesis}.`);
}

function statusBlock(v, now, bucket, score) {
  const d = waitDays(v, now);
  const due = v.last_contacted_at ? new Date(new Date(v.last_contacted_at).getTime() + NUDGE_DAYS * 864e5) : null;
  const text = {
    nudge: ["Follow up due", d == null ? "Contacted, no date recorded" : `Contacted ${d} days ago, no reply`],
    waiting: [`Follow up on ${due ? fmtDate(due.toISOString()) : "?"}`, `Contacted ${d} days ago`],
    talks: ["In talks", d == null ? "" : `Last contact ${d} days ago`],
    approved: [v.status === "closed" ? "Closed" : "Approved", v.status === "closed" ? "Deal closed" : "Committed to invest"],
    declined: ["Declined", v.revisit_on ? `Revisit on ${fmtDate(v.revisit_on)}` : "No revisit date set"],
  }[bucket];
  if (text) return el("div", { class: "statusblock" }, el("div", { class: "big" }, text[0]), el("div", { class: "sub2" }, text[1]));
  if (bucket === "skip") return el("div", { class: "statusblock" }, el("div", { class: "big" }, "Not a fit"), el("div", { class: "sub2" }, (v.signal_summary || "").replace("Skipped: ", "")));
  return el("div", { class: "statusblock", style: "min-width:200px" }, el("div", { class: "big", style: `font-size:44px;color:${scoreColor(score)}` }, String(score)),
    el("div", { class: "pl" }, el("span", {}, "Follow-up score"), el("span", {}, `${score}%`)),
    el("div", { class: "pbar" }, el("i", { style: `width:${score}%;background:${scoreColor(score)}` })),
    el("div", { class: "sub2" }, "70+ strong \u00b7 40\u201369 medium \u00b7 under 40 weak"));
}

function declinedPanel(d) {
  const why = (d.interactions || []).find((i) => i.kind === "declined");
  return el("div", { class: "panel", style: "margin-bottom:14px" }, el("h3", {}, "Declined"),
    el("p", { style: "margin:0 0 10px" }, why && why.note ? `Reason: ${why.note}` : "No reason recorded. Add one next time you log a decline."),
    quickActions(d.vc, "declined"));
}

function peopleOf(d) {
  const m = new Map();
  const add = (name, patch) => { const k = name.toLowerCase(); m.set(k, { name, role: "", ...(m.get(k) || {}), ...Object.fromEntries(Object.entries(patch).filter(([, v]) => v)) }); };
  for (const p of d.people) add(p.name, { role: p.role, source_url: p.source_url, source_domain: p.source_domain, source_tier: p.source_tier, via: "found" });
  for (const e of d.evidence) if (e.person_name) add(e.person_name, { role: e.person_role, via: (m.get(e.person_name.toLowerCase()) || {}).via || "signal" });
  for (const c of d.contacts) add(c.name, { role: c.role, linkedin_url: c.linkedin_url, note: c.note, via: "manual" });
  return [...m.values()].map((p) => ({ ...p, activity: d.evidence.filter((e) => (e.person_name || "").toLowerCase() === p.name.toLowerCase()) }))
    .sort((a, b) => (b.via === "manual") - (a.via === "manual") || b.activity.length - a.activity.length);
}

function personCard(p) {
  const src = safeUrl(p.source_url), li = safeUrl(p.linkedin_url);
  const badge = p.via === "manual" ? el("span", { class: "chip good" }, "Added by you")
    : p.source_tier ? el("span", { class: `chip tier-${p.source_tier}` }, `Named on ${p.source_domain}`) : el("span", { class: "chip" }, "Named in a signal");
  return el("div", { class: "person" }, el("b", {}, p.name), p.role ? ` \u00b7 ${p.role}` : "", " ", badge,
    el("div", { class: "meta" }, src ? el("a", { href: src, target: "_blank", rel: "noopener noreferrer" }, "Source") : null, src && li ? " \u00b7 " : "",
      li ? el("a", { href: li, target: "_blank", rel: "noopener noreferrer" }, "LinkedIn") : null),
    p.note ? el("div", { class: "meta" }, p.note) : null,
    p.activity.length ? p.activity.slice(0, 3).map((e) => el("div", { class: "meta" }, `${fmtDate(e.published_date)} \u00b7 ${label(e.type)}: ${e.summary} `,
      safeUrl(e.url) ? el("a", { href: safeUrl(e.url), target: "_blank", rel: "noopener noreferrer" }, "source") : null))

function contactForm(v) {

function whoPanel(d) {
  const ppl = peopleOf(d);

const KINDS = [["reached_out", "I reached out"], ["follow_up", "I followed up"], ["replied", "They replied"], ["call", "We had a call"], ["meeting", "We met"], ["approved", "They approved (committed to invest)"], ["closed", "Deal closed"], ["declined", "They declined"], ["note", "Just a note"]];

function logPanel(v) {
  const kind = el("select", {}, KINDS.map(([k, t]) => el("option", { value: k }, t)));

  const when = el("select", {}, opts.map(([n, t]) => el("option", { value: String(n) }, `${t} \u00b7 ${fmtDate(localIso(n))}`)), el("option", { value: "pick" }, "Pick a date\u2026"));
  const picker = el("input", { type: "date", value: localIso(0), style: "display:none" });
  when.onchange = () => { picker.style.display = when.value === "pick" ? "block" : "none"; };
  const status = el("select", {}, el("option", { value: "" }, "Keep automatic (recommended)"),
    ["to_contact", "waiting", "in_conversation", "approved", "closed", "declined"].map((x) => el("option", { value: x }, `Set to: ${LBL.status[x]}`)));
  const note = el("textarea", { rows: "3", placeholder: "What happened? (private)" });
  kind.onchange = () => { note.placeholder = kind.value === "declined" ? "Why did they decline? (this is saved as the reason)" : "What happened? (private)"; };
  const save = el("button", { class: "primary", onclick: async () => {
    const day = when.value === "pick" ? picker.value : localIso(Number(when.value));
    const res = await editCall({ action: "log", vc_id: v.id, kind: kind.value, occurred_on: day, note: note.value, status: status.value || undefined });
    if (res) { savedToast(v, res, "Saved", () => loadProfile(v.id)); loadProfile(v.id); }
  } }, "Save");
  return el("div", { class: "panel" }, el("h3", {}, "Log activity"),
    el("div", { class: "form" }, el("div", { class: "two" }, el("label", {}, "What happened", kind), el("label", {}, "When", when, picker)),
      el("label", {}, "Note", note),
      el("details", {}, el("summary", { class: "note" }, "Set the status manually (optional)"), el("div", { class: "form", style: "margin-top:8px" }, status)),
      save),
    el("p", { class: "note" }, `Currently: ${LBL.status[v.status]}. Saving updates your status and last-contacted date straight away and moves this investor to the right place on the dashboard.`));
}

function privatePanel(d) {
  if (!d.editor) {
    return el("div", { class: "panel" }, el("h3", {}, "Notes and history"),
      el("p", { class: "note", style: "margin:0" }, "Editing is not switched on yet. Add DASHBOARD_ED_URL in Vercel to keep notes and log activity."));
  }
  const notes = el("textarea", { rows: "5", placeholder: "Anything worth remembering about this investor" }); notes.value = d.notes || "";
  const del = (i) => {
    const b = el("button", { class: "delbtn", title: "Delete this entry" }, "\u00d7");
    b.onclick = async () => {
      if (!confirm("Delete this log entry? 'Last contacted' is recalculated from what remains. The status is not changed.")) return;
      if (await editCall({ action: "delete_interaction", vc_id: d.vc.id, interaction_id: Number(i.id) })) { toast("Entry deleted"); loadProfile(d.vc.id); }
    };
    return b;
  };
  const timeline = (d.interactions || []).map((i) => el("div", { class: "tl" }, del(i), el("b", {}, (KINDS.find(([k]) => k === i.kind) || [0, label(i.kind)])[1]), " ", el("small", {}, fmtDate(i.occurred_on)), i.note ? el("div", {}, i.note) : null));
  return el("div", { class: "panel" }, el("h3", {}, "Your notes and history"),
    el("div", { class: "form" }, el("label", {}, "Notes", notes),
      el("button", { onclick: async () => { if (await editCall({ action: "notes", vc_id: d.vc.id, notes: notes.value })) alert("Saved."); } }, "Save notes")),
    el("div", { style: "margin-top:14px" }, timeline.length ? timeline : el("div", { class: "empty" }, "No activity logged yet.")));
}

function fitPanel(v) {

function relPanel(v, now) {
  const clear = el("button", { class: "linkbtn", title: "Forget the last-contacted date" }, "Clear");
  clear.onclick = async () => {
    if (!confirm("Clear 'Last contacted'? The status and the log are not changed.")) return;

  };

    ["Latest signal", v.last_signal_date ? `${fmtDate(v.last_signal_date)} (${daysAgo(v.last_signal_date, now)}d ago)` : "None yet"]];
  const next = el("input", { placeholder: "e.g. send the deck by Friday", maxlength: "200" }); next.value = v.next_step || "";
  const save = el("button", { onclick: async () => { if (await editCall({ action: "next_step", vc_id: v.id, next_step: next.value })) toast("Next step saved"); } }, "Save");
  return el("div", { class: "panel" }, el("h3", {}, "Relationship"),

    el("div", { class: "form", style: "margin-top:12px" }, el("label", {}, "Next step", el("div", { style: "display:flex;gap:6px" }, next, save))));

const REASON = {
  blocked_source: "low-quality source", social_source_disabled: "social post (not trusted)", untrusted_source: "source not on the trusted list",
  quote_not_on_page: "quote not found on the page", url_not_in_results: "link was not in the search results", wrong_firm: "page was about a different firm",
  wrong_person: "page didn't name the person", outside_window: "older than 30 days", no_api_date: "no publish date",
  duplicate_url: "duplicate", unknown_type: "unrecognised type", malformed: "malformed", person_check_failed: "a partner check failed",
  people_discovery_failed: "partner search failed",
};

function checkSummary(c) {
  const d = c.detail || {}, lines = [];
  const outcome = !c.ok ? ["red", "Check failed"] : c.outcome === "signal" ? ["green", "Found activity"] : c.outcome === "skipped_fit" ? ["gray", "Skipped: not a fit"] : c.outcome === "rescored" ? ["gray", "Re-scored from saved signals"] : ["blue", "Nothing new in 30 days"];
  if (!c.ok) lines.push(`${friendlyError(c.error)} this run, so the previous results were kept.`);
  else if (c.outcome === "skipped_fit") lines.push((d.reason || "Not a fit for this round") + ", so no searches were run.");
  else if (c.outcome === "rescored") lines.push(`Re-scored from ${d.signals_on_file ?? 0} saved signal${d.signals_on_file === 1 ? "" : "s"}. No search was made, so it cost nothing.`);
  else {
    const via = d.provider ? ` via ${d.provider}${d.searches != null ? ` (${d.searches} search${d.searches === 1 ? "" : "es"})` : ""}` : "";
    lines.push(d.pages_found != null ? `Searched ${d.pages_found} pages${via}, ${d.pages_usable} usable.` : `Searched ${c.n_pages} pages.`);
    const sk = Object.entries(d.skipped || {});
    if (sk.length) lines.push("Skipped untrusted sources: " + sk.map(([k, n]) => `${k} \u00d7${n}`).join(", ") + ".");
    if (d.undated) lines.push(`Ignored ${d.undated} page${d.undated > 1 ? "s" : ""} from trusted sources with no publish date (dates must come from the search API).`);
    if (c.n_signals) lines.push(`Kept ${c.n_signals} signal${c.n_signals > 1 ? "s" : ""}` + (d.signals_people ? ` (${d.signals_people} from partners)` : "") + ".");
    if (d.people_checked && d.people_checked.length) lines.push("Partners checked: " + d.people_checked.join(", ") + ".");
    const rj = {};
    for (const x of (c.dropped || [])) rj[x.reason] = (rj[x.reason] || 0) + 1;
    const rl = Object.entries(rj);
    if (rl.length) lines.push("Rejected by validation: " + rl.map(([r, n]) => `${REASON[r] || label(r)} \u00d7${n}`).join(", ") + ".");
  }
  return { outcome, lines };
}

function checksPanel(checks) {
  // Identical back-to-back results are one entry with a count, not a wall of repeats.
  const groups = [];
  for (const c of checks) {
    const sum = checkSummary(c), key = sum.outcome[1] + "|" + sum.lines.join("|");
    const last = groups[groups.length - 1];
    if (last && last.key === key) last.count++; else groups.push({ key, sum, c, count: 1 });
  }
  const rows = groups.slice(0, 12).map(({ sum, c, count }) => el("div", { class: "tl" },
    el("div", {}, el("b", {}, new Date(c.checked_at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })), " ",
      el("span", { class: `chip c-${sum.outcome[0]}` }, sum.outcome[1]), count > 1 ? el("small", {}, ` \u00b7 same result in ${count} checks`) : null),
    sum.lines.map((t) => el("div", { class: "meta" }, t))));
  const rest = el("div", { style: "display:none" }, rows.slice(2));
  const more = rows.length > 2 ? el("button", { class: "seemore" }, `See ${rows.length - 2} more`) : null;
  if (more) more.onclick = () => { const open = rest.style.display === "none"; rest.style.display = open ? "block" : "none"; more.textContent = open ? "Show less" : `See ${rows.length - 2} more`; };
  return el("div", { class: "panel wide" }, el("h3", {}, "Check history"),
    rows.length ? [rows.slice(0, 2), rest, more] : el("div", { class: "empty" }, "Not checked yet."),
    el("p", { class: "note" }, "Each entry is a run for this investor, newest first. Repeated identical results are combined."));
}

function signalRow(e) {
  const up = el("button", { class: e.useful === true ? "on" : "" }, "Useful");
  const down = el("button", { class: e.useful === false ? "on" : "" }, "Not useful");
  const b = [[up, true], [down, false]];
  up.onclick = () => sendFeedback(e, true, b); down.onclick = () => sendFeedback(e, false, b);
  const href = safeUrl(e.url);
  return el("div", { class: "ev" },
    el("div", { class: "chips" }, tag("type", e.type), relChip(e), el("span", { class: "chip" }, fmtDate(e.published_date)), trustChip(e),
      e.person_name ? el("span", { class: "chip" }, `by ${e.person_name}`) : null),
    el("p", { class: "why" }, e.summary), el("q", {}, e.quote),
    href ? el("a", { href, target: "_blank", rel: "noopener noreferrer" }, "Check the source") : null, " ", up, " ", down);
}

function renderProfile(d) {
  const v = d.vc, now = new Date(), score = v.follow_up_score ?? 0;
  const bucket = bucketOf(v, now, hotSet(d.evidence, now));
  const unverified = d.evidence.filter((e) => e.source_tier === "legacy_unverified").length;
  show(
    el("a", { class: "back", href: "#/" }, "\u2190 Back to pipeline"),
    el("div", { class: "ph" },
      el("div", {}, el("div", { class: "namerow" }, logoFor(v), el("h1", {}, v.firm)),
        el("div", { class: "chips" }, btag(bucket), tag("status", v.status),
          el("span", { class: "chip" }, v.geo), el("span", { class: "chip" }, v.stage_focus)),
        (v.signal_summary || "Not scored yet.").split(" | ").length > 1
          ? el("ul", { class: "bullets" }, v.signal_summary.split(" | ").map((t) => el("li", {}, t)))
          : el("p", { class: "sub", style: "margin-top:10px;max-width:640px" }, v.signal_summary || "Not scored yet.")),
      statusBlock(v, now, bucket, score)),
    fitNote(v, bucket),
    bucket === "declined" ? declinedPanel(d) : null,
    el("div", { class: "pgrid" },
      whoPanel(d), logPanel(v),
      el("div", { class: "panel wide" }, el("h3", {}, `Signals (${d.evidence.length})`),
        unverified ? el("p", { class: "note", style: "margin:-6px 0 8px" }, `${unverified} signal${unverified > 1 ? "s" : ""} below ${unverified > 1 ? "come" : "comes"} from a source that was not verified, so ${unverified > 1 ? "they are" : "it is"} shown for reference only and not counted in the score.`) : null,
        d.evidence.length ? d.evidence.map(signalRow) : el("div", { class: "empty" }, "No signal from a trusted source yet.")),
      privatePanel(d), relPanel(v, now), fitPanel(v), el("div", {}), checksPanel(d.checks)));
  window.scrollTo(0, 0);
}

async function loadProfile(id) {
  show(el("div", { class: "sk", style: "height:34px;width:260px;margin-bottom:18px" }), el("div", { class: "sk", style: "height:220px;margin-bottom:12px" }), el("div", { class: "sk", style: "height:220px" }));
  let data;
  try { data = await fetchJson(`/api/vc?id=${id}`); }
  catch (e) { show(el("a", { class: "back", href: "#/" }, "\u2190 Back to pipeline"), failBox("Could not load this investor", () => loadProfile(id), e)); return; }
  try { renderProfile(data); }
  catch (e) { console.error(e); show(el("a", { class: "back", href: "#/" }, "\u2190 Back to pipeline"), failBox("The page hit a display error", () => loadProfile(id), e)); }
}

function route() {
  const m = location.hash.match(/^#\/vc\/(\d+)$/);
  if (m) return loadProfile(Number(m[1]));
  return load(location.hash === "#/status" ? "status" : "action");
}

// The database sleeps when idle and takes a few seconds to wake, so the first request after a quiet spell can
// fail once. Retry quietly a couple of times before showing an error, and offer a Retry button when it does.
async function fetchJson(url, tries = 3) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    } catch (e) { last = e; if (i < tries - 1) await new Promise((res) => setTimeout(res, 1000 * (i + 1))); }
  }
  throw last;
}

const failBox = (title, retry, e) => el("div", { class: "insight bad" }, el("h3", {}, title),
  el("p", {}, "The database may be waking up after being idle. This usually clears in a few seconds."),
  el("p", { class: "note" }, `Details: ${(e && e.message) || "network error"}`),
  el("button", { class: "primary", onclick: retry }, "Retry"));

async function load(view, quiet) {
  view = view || (location.hash === "#/status" ? "status" : "action");
  if (!quiet) show(...skeleton());
  let data;
  try { data = await fetchJson("/api/pipeline"); }
  catch (e) { show(failBox("Could not load the pipeline", () => load(view), e)); return; }
  try { view === "status" ? renderStatus(data) : render(data); }
  catch (e) { console.error(e); show(failBox("The page hit a display error", () => load(view), e)); }
}
window.addEventListener("hashchange", route);
route();
