<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investor Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Geist:wght@400..700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --panel: #14141b; --panel2: #1b1b24; --line: #262633; --text: #f3f3f7; --muted: #a9a9be;
    --purple: #7b5cff; --purple2: #b07bff; --green: #4ade80; --pink: #ff5fa2; --blue: #5b8cff; --amber: #f5b14a; --red: #ff7a7a;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 24px 20px 72px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .logo { width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, var(--purple), var(--purple2)); }
  h1 { font: 700 28px/1.1 var(--mono); margin: 0 0 6px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0; }
  .sub b { color: var(--text); font-weight: 600; }
  .hero { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: 14px; margin-bottom: 30px; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
  .insight { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .insight.bad { border-color: #5a2a2a; }
  .insight h3 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--pink); display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: #200; flex: none; }
  .insight p { margin: 0 0 12px; color: #c9c9d6; font-size: 13px; }
  .kpi { border-radius: 16px; padding: 16px; background: linear-gradient(135deg, #6b4df0 0%, #a46cf5 100%); display: grid; gap: 14px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; opacity: .9; margin-bottom: 6px; }
  .track { height: 8px; border-radius: 99px; background: rgba(255,255,255,.28); overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; background: #fff; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } }
  .tile { background: rgba(255,255,255,.16); border-radius: 12px; padding: 12px 14px; }
  .tile small { display: block; font-size: 12px; opacity: .85; }
  .tile strong { font: 700 22px/1.3 var(--mono); }
  .tile em { font-style: normal; font-size: 12px; opacity: .85; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
  .chip.good { color: var(--green); background: rgba(74,222,128,.1); border-color: rgba(74,222,128,.25); }
  .chip.warn { color: var(--amber); } .chip.bad { color: var(--red); }
  h2 { font: 600 18px var(--mono); margin: 0 0 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h2 small { font: 400 12px system-ui; color: var(--muted); }
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) { .board { grid-template-columns: 1fr; } }
  .col h4 { margin: 0 0 10px; font: 600 14px var(--mono); display: flex; justify-content: space-between; color: var(--text); }
  .col h4 span { color: var(--muted); font-weight: 400; }
  .col .hint { color: var(--muted); font-size: 12px; margin: -4px 0 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .card .name { font-weight: 650; font-size: 15px; }
  .card .meta { color: var(--muted); font-size: 12px; }
  .amount { font: 700 26px/1.2 var(--mono); margin: 8px 0 6px; }
  .pl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .pbar { height: 6px; border-radius: 99px; background: var(--panel2); overflow: hidden; }
  .pbar i { display: block; height: 100%; border-radius: 99px; }
  .why { margin: 10px 0 0; color: #cfcfdb; font-size: 13px; }
  .age { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .ev { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; font-size: 12px; }
  .ev q { display: block; color: var(--muted); margin: 3px 0 6px; }
  a { color: #9db6ff; }
  button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 8px; padding: 2px 9px; cursor: pointer; }
  button:hover { border-color: var(--purple); }
  button.on { background: var(--purple); border-color: var(--purple); }
  .mini { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; font-size: 13px; }
  .mini span:last-child { color: var(--muted); font-size: 12px; text-align: right; }
  .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; font-size: 13px; }
  .skipped { margin-top: 30px; }
  a.vclink { color: var(--text); text-decoration: none; }
  a.vclink:hover { color: #b9a7ff; text-decoration: underline; }
  .back { display: inline-block; margin-bottom: 14px; color: var(--muted); text-decoration: none; font-size: 13px; }
  .back:hover { color: var(--text); }
  .ph { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 18px; }
  .ph h1 { margin-bottom: 10px; }
  .big { font: 700 44px/1 var(--mono); }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 860px) { .pgrid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .panel.wide { grid-column: 1 / -1; }
  .panel h3 { margin: 0 0 12px; font: 600 15px var(--mono); }
  .person { padding: 10px 0; border-top: 1px solid var(--line); }
  .person:first-of-type { border-top: 0; padding-top: 0; }
  .person b { font-size: 15px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .note { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; border-top: 0; }
  .chip.c-green { color: #4ade80; background: rgba(74,222,128,.12); border-color: rgba(74,222,128,.32); }
  .chip.c-amber { color: #f5b14a; background: rgba(245,177,74,.12); border-color: rgba(245,177,74,.32); }
  .chip.c-blue { color: #7aa7ff; background: rgba(91,140,255,.13); border-color: rgba(91,140,255,.34); }
  .chip.c-purple { color: #b9a4ff; background: rgba(123,92,255,.15); border-color: rgba(123,92,255,.38); }
  .chip.c-teal { color: #3ddbd9; background: rgba(61,219,217,.11); border-color: rgba(61,219,217,.3); }
  .chip.c-red { color: #ff8a8a; background: rgba(255,122,122,.12); border-color: rgba(255,122,122,.32); }
  .chip.c-gray { color: #b8b8cc; }
  .board.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 1250px) { .board.five { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 800px) { .board.five { grid-template-columns: 1fr; } }
  .chip { white-space: nowrap; }
  .notice { border: 1px solid #5a2a2a; background: rgba(255,122,122,.07); color: #ffb3b3; border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 10px; }
  .insight.best { display: flex; flex-direction: column; gap: 8px; }
  .insight.best .row { align-items: center; flex-wrap: nowrap; }
  .insight.best h3 { margin: 0; }
  .insight.best p { margin: 0; }
  .bestname { font: 700 24px/1.2 var(--mono); }
  .bestname a { color: var(--text); text-decoration: none; }
  .bestname a:hover { color: #b9a7ff; }
  .insight.best .score { font: 700 28px var(--mono); color: var(--green); }
  .dot.ok { background: var(--green); }
  .insight.best a.more { margin-top: auto; }
  .row { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
  .card.compact { padding: 10px 12px; margin-bottom: 8px; }
  .card.compact .row { align-items: center; flex-wrap: nowrap; gap: 8px; }
  .card.compact .name { font-size: 14px; }
  .pts { font: 700 16px var(--mono); flex: none; }
  .why.one { margin: 6px 0 0; font-size: 12.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.compact .qa { margin-top: 8px; }
  .card.compact .qa button { padding: 1px 8px; }
  button.showall { width: 100%; margin-top: 4px; padding: 6px; color: var(--muted); }
  .board.auto { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .sk { background: linear-gradient(90deg, var(--panel) 25%, var(--panel2) 50%, var(--panel) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 12px; }
  @keyframes sh { to { background-position: -200% 0; } }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #04210f; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 9; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  .runline { font-size: 12px; color: rgba(255,255,255,.85); }
  .kpi h3 { margin: 0; font: 600 15px var(--mono); }
  .tile.click { cursor: default; }
  .tile strong { font-size: 26px; }
  details.sec { margin-top: 26px; }
  details.sec > summary { cursor: pointer; font: 600 16px var(--mono); list-style: none; display: flex; gap: 10px; align-items: baseline; }
  details.sec > summary::before { content: "\25b8"; color: var(--muted); }
  details.sec[open] > summary::before { content: "\25be"; }
  details.sec > summary small { font: 400 12px system-ui; color: var(--muted); }
  .sec input.filter { margin: 12px 0 10px; width: 260px; max-width: 100%; font: inherit; font-size: 13px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .quiet.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 14px; }
  .emptyline { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
  .card.compact .meta { margin-top: 4px; font-size: 12px; }
  .pts { font-size: 18px; }
  .qa button.primary { padding: 4px 12px; font-weight: 600; }
  ul.bullets { margin: 10px 0 0; padding-left: 18px; max-width: 680px; color: var(--muted); font-size: 14px; }
  ul.bullets li { margin-bottom: 4px; }
  .tiles.four { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 560px) { .tiles.four { grid-template-columns: repeat(2, 1fr); } }
  .namerow { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .namerow h1 { margin: 0; }
  .vlogo { width: 52px; height: 52px; border-radius: 13px; flex: none; }
  img.vlogo { background: #fff; object-fit: contain; padding: 7px; }
  .vlogo.initials { display: grid; place-items: center; background: linear-gradient(135deg, var(--purple), var(--purple2)); color: #fff; font: 700 18px var(--mono); }
  button.seemore { margin-top: 4px; color: var(--muted); }
  .hero { align-items: stretch; }
  .kpi { align-content: space-between; }
  .tile.click { cursor: pointer; transition: background .15s; }
  .tile.click:hover { background: rgba(255,255,255,.26); }
  .legend { font-size: 12px; color: var(--muted); margin: -14px 0 22px; }
  .legend b { font-weight: 600; }
  .warnbox { border: 1px solid rgba(245,177,74,.45); background: rgba(245,177,74,.08); color: #f7c97a; border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
  .statusblock { min-width: 210px; text-align: right; }
  .statusblock .big { font-size: 22px; }
  .statusblock .sub2 { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .next { margin-top: 6px; font-size: 12.5px; color: #dcdcf0; }
  .card.compact .meta.warn { color: #f7c97a; }
  .toast { display: flex; align-items: center; gap: 12px; }
  .toastbtn { background: rgba(0,0,0,.18); border: 0; color: #04210f; font-weight: 700; padding: 3px 10px; border-radius: 7px; cursor: pointer; }
  .toastbtn:hover { background: rgba(0,0,0,.3); }
  .fitnote { color: var(--muted); font-size: 12.5px; margin: -6px 0 14px; }
  details.notice > summary { cursor: pointer; list-style: none; }
  details.notice > summary::before { content: "\25b8  "; }
  details.notice[open] > summary::before { content: "\25be  "; }
  details.notice p { margin: 6px 0 0 14px; color: #f0b9b9; font-size: 12.5px; }
  button.linkbtn { border: 0; background: none; color: #b9a7ff; padding: 0 0 0 8px; font-size: 12px; cursor: pointer; text-decoration: underline; }
  button.delbtn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; float: right; }
  button.delbtn:hover { color: var(--red); }
  .tbl { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  .tbl .inner { min-width: 1240px; }
  .trow { display: grid; grid-template-columns: var(--cols); gap: 12px; padding: 10px 14px; align-items: center; border-top: 1px solid var(--line); font-size: 13px; }
  .trow.head { background: var(--panel2); color: var(--muted); font-weight: 600; font-size: 12px; border-top: 0; border-radius: 12px 12px 0 0; }
  .trow .vc b { display: block; font-size: 14px; } .trow .vc a { color: var(--text); text-decoration: none; } .trow .vc a:hover { color: #b9a7ff; }
  .trow .vc small { color: var(--muted); }
  .trow .dim { color: var(--muted); }
  .trow .qa { margin: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 12px; }
  .toolbar input, .toolbar select { font: inherit; font-size: 13px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .toolbar input { flex: 1; min-width: 220px; }
  .toolbar .count { color: var(--muted); font-size: 12.5px; }
  .coverage { font-size: 12px; color: rgba(255,255,255,.9); margin-top: 4px; }
  .coverage.warn { color: #ffe3a8; }
  .reachform { display: grid; gap: 8px; width: 100%; margin-top: 4px; }
  .reachform .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .reachform select, .reachform input { font: inherit; font-size: 13px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
  .suggested { margin-top: 4px; font-size: 12.5px; color: #dcdcf0; }
  .tabs { display: flex; gap: 6px; margin: 0 0 18px; }
  .tabs a { padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); text-decoration: none; font-size: 13px; }
  .tabs a.on { background: var(--purple); border-color: var(--purple); color: #fff; }
  .tier-legacy_unverified { color: var(--red); border-color: rgba(255,122,122,.4); }
  .form { display: grid; gap: 8px; }
  .form label { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
  .form input, .form select, .form textarea { font: inherit; font-size: 13px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
  .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button.primary { background: var(--purple); border-color: var(--purple); padding: 6px 14px; font-size: 13px; }
  .tl { border-left: 2px solid var(--line); padding-left: 12px; margin: 0 0 10px 4px; font-size: 13px; }
  .tl small { color: var(--muted); }
  a.more { display: inline-block; margin-top: 10px; font-size: 12px; color: #b9a7ff; text-decoration: none; }
  a.more:hover { text-decoration: underline; }
  .qa { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tier-own_site { color: var(--green); } .tier-news { color: var(--blue); } .tier-social { color: var(--amber); }

  /* ---- Map (home) and Calendar views */
  .tabs a.cal-tab { border-color: var(--purple2); color: #fff; }
  .legend2 { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .legend2 i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 8px; vertical-align: -2px; }
  .twocol { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .twocol > .main { flex: 3 1 640px; min-width: 0; }
  .twocol > aside { flex: 1 1 340px; max-width: 440px; min-width: 0; }
  aside h2 { font: 700 20px var(--mono); margin: 0 0 12px; }
  .tm { display: flex; flex-direction: column; gap: 6px; height: 640px; }
  .tm-row { display: flex; gap: 6px; min-height: 0; }
  .tm-tile { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 14px 16px;
    border-radius: 14px; min-width: 0; min-height: 84px; overflow: hidden; text-decoration: none; transition: transform .12s, filter .12s; }
  .tm-tile:hover { filter: brightness(.93); transform: translateY(-2px); }
  .tm-tile:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .tm-tile.reach { background: #6fe39f; color: #052612; }
  .tm-tile.warm { background: #ffc94d; color: #3d2600; }
  .tm-tile.dorm { background: #dfe3ea; color: #1f2733; }
  .tm-tile .tn { font-weight: 800; letter-spacing: -.02em; line-height: 1.05; overflow-wrap: anywhere; }
  .tm-tile .tb { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; width: 100%; font-size: 13px; font-weight: 600; }
  .tm-tile .tb span { white-space: nowrap; }
  .tm-tile .tb b { font: 700 15px var(--mono); }
  @media (max-width: 760px) { .tm { height: auto; } .tm-row { flex: none !important; flex-direction: column; } .tm-tile { flex: none !important; } .twocol > .main { flex-basis: 100%; } }
  .calbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 12px; }
  .calbar h2 { margin: 0; flex: 1 1 200px; }
  .seg2 { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg2 button { background: transparent; border: 0; color: var(--muted); padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg2 button.on { background: var(--purple); color: #fff; }
  .navb { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .navb:hover { border-color: var(--purple2); }
  .calwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); min-width: 780px; }
  .cal .dow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .cal .cell { min-height: 126px; padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .cal > :nth-child(7n) { border-right: 0; }
  .cell.today { background: rgba(123,92,255,.13); }
  .cell.out { opacity: .42; }
  .cell .top2 { display: flex; align-items: center; justify-content: space-between; }
  .cell .dn { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 14px; font: 700 13px var(--mono); }
  .cell.today .dn { background: #f3f3f7; color: #0a0a0f; }
  .cell .addb { opacity: 0; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; width: 24px; height: 24px; cursor: pointer; line-height: 1; }
  .cell:hover .addb, .cell .addb:focus-visible { opacity: 1; }
  .pill { font-size: 12.5px; font-weight: 600; line-height: 1.3; padding: 5px 8px; border-radius: 8px; display: flex; gap: 6px; align-items: flex-start; justify-content: space-between; }

<body>
<main id="app"></main>
<script>
const app = document.getElementById("app");
const show = (...nodes) => app.replaceChildren(...nodes.flat(Infinity).filter((n) => n != null && n !== false));

// Everything from the database (including model-written summaries) is untrusted text: build DOM, never innerHTML.
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k === "onclick") n.onclick = v; else if (k === "style") n.style.cssText = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
}
const safeUrl = (u) => { try { const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:" ? x.href : null; } catch { return null; } };
const fmtDate = (d) => d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }) : "never";
// Dates are the user's LOCAL calendar days. A date-only value ("2026-10-12") is a calendar day, so it is compared
// to today's local date, not to a UTC timestamp; a timestamp is compared by elapsed time.
const localIso = (daysBack = 0) => { const t = new Date(); t.setDate(t.getDate() - daysBack); return t.toLocaleDateString("en-CA"); };
const isDateOnly = (d) => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d);
const daysAgo = (d, now) => {
  if (isDateOnly(d)) {
    const [y, m, dd] = d.split("-").map(Number);
    const a = new Date(y, m - 1, dd), b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.max(0, Math.round((b - a) / 864e5));
  }
  return Math.max(0, Math.floor((now - new Date(d)) / 864e5));
};
const label = (s) => String(s || "").replace(/_/g, " ");
const LBL = {
  status: { to_contact: "Prospect", waiting: "Contacted", in_conversation: "In talks", approved: "Approved", closed: "Closed", declined: "Declined" },
  action: { reach_out: "Reach out now", nudge: "Follow up", hold: "Hold", quiet_list: "Dormant", skip: "Not a fit" },
  type: { portfolio_investment: "New investment", fund_announcement: "Fund news", interview: "Interview", blog_post: "Blog post", event_appearance: "Event / talk", other: "Other" },
};
const COL = {
  status: { to_contact: "purple", waiting: "amber", in_conversation: "blue", approved: "green", closed: "green", declined: "red" },
  action: { reach_out: "green", nudge: "amber", hold: "blue", quiet_list: "gray", skip: "red" },
  type: { portfolio_investment: "green", fund_announcement: "purple", interview: "blue", blog_post: "teal", event_appearance: "amber", other: "gray" },
};
const BUCKET = {
  reach: ["Reach out", "green"], warm: ["Warm", "purple"], pitch: ["Pitch with thesis hook", "teal"], park: ["Park", "gray"], nudge: ["Follow up due", "amber"], waiting: ["Contacted", "blue"], talks: ["In talks", "blue"],
  approved: ["Approved", "green"], declined: ["Declined", "red"], dormant: ["Dormant", "gray"], skip: ["Not a fit", "red"],
};
const btag = (b) => el("span", { class: `chip c-${BUCKET[b][1]}` }, BUCKET[b][0]);
const relChip = (e) => e.relevance === "logistics" ? el("span", { class: "chip c-green" }, "Logistics") : e.relevance ? el("span", { class: "chip c-gray" }, "General activity") : null;
const tag = (kind, v) => v ? el("span", { class: `chip c-${COL[kind][v] || "gray"}` }, LBL[kind][v] || label(v)) : null;
// Fit (is this fund a good target?) and timing (is there a fresh reason to write now?) are shown separately, never blended.
const FIT = { high: ["High fit", "green"], medium: ["Medium fit", "amber"], low: ["Low fit", "gray"], excluded: ["Not a fit", "red"] };
const FITRANK = { high: 0, medium: 1, low: 2 };
const fitRank = (v) => FITRANK[v.fit_level] ?? 1;
const fitChip = (v) => v.fit_level && FIT[v.fit_level] ? el("span", { class: `chip c-${FIT[v.fit_level][1]}`, title: [...(v.fit_good || []), ...(v.fit_concerns || [])].join(" \u00b7 ") || "Fit rating" }, FIT[v.fit_level][0]) : null;
const timingOf = (v, hot) => hot && hot.has(v.id) ? ["Hot", "green"] : hot && hot.logi && hot.logi.has(v.id) ? ["Warm", "purple"] : ["Cold", "gray"];
const timingChip = (v, hot) => { const [t, c] = timingOf(v, hot); return el("span", { class: `chip c-${c}`, title: "Timing: is there a fresh logistics signal?" }, `Timing: ${t}`); };
const scoreColor = (s) => s >= 70 ? "var(--green)" : s >= 40 ? "var(--blue)" : "var(--pink)";

async function sendFeedback(ev, useful, btns) {
  try {
    const r = await fetch("/api/feedback", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ evidence_id: ev.id, vc_id: ev.vc_id, useful }) });
    if (!r.ok) throw new Error(r.status);
    btns.forEach(([b, v]) => b.classList.toggle("on", v === useful));
  } catch { alert("Could not save feedback."); }
}

const TIER = { own_site: "Firm's own site", news: "News / press", social: "Social post", unlisted: "Unlisted source", legacy_unverified: "Unverified source" };
function trustChip(e) {
  return e.source_tier ? el("span", { class: `chip tier-${e.source_tier}` }, `${TIER[e.source_tier] || e.source_tier}: ${e.source_domain}`) : null;
}

// ---- one set of rules for where an investor belongs. Driven by YOUR status and dates, so logging
// ---- an action moves the card immediately; scores and signals still come from the last run.
const NUDGE_DAYS = 7;        // keep in step with routing.waiting_nudge_days in weights.yaml
const MIN_REACH = 35;        // keep in step with routing.reach_out_min_score
const MAX_SIGNAL_AGE = 14;   // keep in step with routing.reach_out_max_signal_age_days

// Days until the freshest logistics signal falls out of the "reach out" window (null if there is none).
function coolsIn(v, evidence, now) {
  const ages = evidence.filter((e) => e.vc_id === v.id && e.relevance === "logistics" && e.source_tier !== "legacy_unverified").map((e) => daysAgo(e.published_date, now));
  return ages.length ? MAX_SIGNAL_AGE - Math.min(...ages) : null;
}
const waitDays = (v, now) => v.last_contacted_at ? daysAgo(v.last_contacted_at, now) : null;
// Investors with a logistics signal fresh enough to justify a cold approach.
// hot = a logistics signal fresh enough to justify a cold approach; hot.logi = any logistics signal in the 30-day window.
function hotSet(evidence, now) {
  const logi = evidence.filter((e) => e.relevance === "logistics" && e.source_tier !== "legacy_unverified");
  const hot = new Set(logi.filter((e) => daysAgo(e.published_date, now) <= MAX_SIGNAL_AGE).map((e) => e.vc_id));
  hot.logi = new Set(logi.map((e) => e.vc_id));
  return hot;
}
const friendlyError = (e) => /gemini|empty response|json/i.test(e || "") ? "The AI step failed" : /exa|search|http|network/i.test(e || "") ? "The search service was unavailable" : "The check did not finish";

function bucketOf(v, now, hot) {
  let status = v.status;
  const revisitDue = status === "declined" && v.revisit_on && v.revisit_on <= localIso(0);
  if (revisitDue) status = "to_contact";
  if (status === "declined") return "declined";
  if (status === "approved" || status === "closed") return "approved";
  if (status === "in_conversation") return "talks";
  if (status === "waiting") { const d = waitDays(v, now); return d == null || d >= NUDGE_DAYS ? "nudge" : "waiting"; }
  if (v.recommended_action === "skip" && !revisitDue) return "skip";
  if (v.recommended_action === "reach_out" && (v.follow_up_score ?? 0) >= MIN_REACH && hot.has(v.id)) return "reach";
  // Not a reach-out now. Fit decides where it goes: a low-fit fund is parked (news or not), a good-fit fund with an
  // older logistics signal is warm, and a high-fit fund with no news at all is pitched on its thesis.
  const logi = hot.logi && hot.logi.has(v.id);
  if (v.fit_level === "low") return logi ? "park" : "dormant";
  if (logi) return "warm";
  return v.fit_level === "high" ? "pitch" : "dormant";
}

function groupVcs(data, now) {
  const hot = hotSet(data.evidence, now);
  const g = { reach: [], warm: [], pitch: [], park: [], nudge: [], waiting: [], talks: [], approved: [], declined: [], dormant: [], skip: [] };
  for (const v of data.vcs) g[bucketOf(v, now, hot)].push(v);
  const byFirm = (a, b) => a.firm.localeCompare(b.firm);
  const byFit = (a, b) => fitRank(a) - fitRank(b) || (b.follow_up_score ?? 0) - (a.follow_up_score ?? 0) || byFirm(a, b);   // best fit first, then best timing
  g.reach.sort((a, b) => (a.check_ok === false) - (b.check_ok === false) || byFit(a, b));
  g.nudge.sort((a, b) => (waitDays(b, now) ?? 999) - (waitDays(a, now) ?? 999));          // longest silence first
  g.waiting.sort((a, b) => (waitDays(b, now) ?? 0) - (waitDays(a, now) ?? 0));
  g.talks.sort((a, b) => (b.last_contacted_at || "") < (a.last_contacted_at || "") ? -1 : 1);
  for (const k of ["approved", "declined", "skip"]) g[k].sort(byFirm);
  g.warm.sort(byFit);
  // With no fresh signal to rank on, rank by how well the fund fits: level, then points, then any timing.
  for (const k of ["pitch", "park", "dormant"]) g[k].sort((a, b) => fitRank(a) - fitRank(b) || (b.fit_points ?? 0) - (a.fit_points ?? 0) || (b.follow_up_score ?? 0) - (a.follow_up_score ?? 0) || byFirm(a, b));
  return g;
}

const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const CHANNELS = [["email", "Email"], ["linkedin", "LinkedIn"], ["warm_intro", "Warm intro"], ["phone", "Phone"], ["event", "In person / event"], ["other", "Other"]];
const ROLE_ORDER = [[/founder/i, 0], [/managing/i, 1], [/general partner/i, 2], [/partner/i, 3]];
const roleRank = (r) => (ROLE_ORDER.find(([re]) => re.test(r || "")) || [0, 9])[1];

// People at each firm: contacts you added first, then those named on trusted pages. Kept globally so cards can use them.
function buildPeopleIndex(data) {
  const m = new Map(), put = (id, c) => { if (!m.has(id)) m.set(id, []); m.get(id).push(c); };
  for (const c of data.contacts || []) put(c.vc_id, { ...c, manual: true });
  for (const p of data.people || []) put(p.vc_id, { ...p, manual: false });
  return m;
}
const peopleOfVc = (v) => (window.__people && window.__people.get(v.id)) || [];

// The partner worth writing to: one YOU added; else the one named on this firm's LOGISTICS signals; else the most
// senior. `leads` says whether there is logistics evidence for them (so the card never implies it when there isn't).
function bestContact(v, evidence) {
  const logi = evidence.filter((e) => e.vc_id === v.id && e.relevance === "logistics" && e.person_name && e.source_tier !== "legacy_unverified");
  const count = (name) => logi.filter((e) => e.person_name.toLowerCase() === name.toLowerCase()).length;
  const ranked = [...peopleOfVc(v)].sort((a, b) => (b.manual - a.manual) || (count(b.name) - count(a.name)) || (roleRank(a.role) - roleRank(b.role)));
  const top = ranked[0];
  return top ? { ...top, leads: count(top.name) > 0 } : null;
}

function signalsOf(v, evidence) {
  const all = evidence.filter((e) => e.vc_id === v.id && e.source_tier !== "legacy_unverified")
    .sort((a, b) => (b.relevance === "logistics") - (a.relevance === "logistics") || (a.published_date < b.published_date ? 1 : -1));
  return { all, best: all[0] };
}

// A toast, optionally with an Undo button that stays for a few seconds longer.
function toast(text, undo) {
  const t = el("div", { class: "toast" }, text);
  let timer;
  if (undo) {
    const b = el("button", { class: "toastbtn" }, "Undo");
    b.onclick = async () => { clearTimeout(timer); t.remove(); await undo(); };
    t.append(b);
  }
  document.body.append(t);
  timer = setTimeout(() => t.remove(), undo ? 9000 : 2600);
}

// After any logged action: confirm it, and offer to put everything back exactly as it was.
function savedToast(v, res, text, reload) {
  toast(text, res && res.id ? async () => {
    if (await editCall({ action: "undo_log", vc_id: v.id, interaction_id: res.id, prev: res.prev })) { toast("Undone"); reload(); }
  } : null);
}

// One-click actions that make sense for where the investor is.
function quickActions(v, bucket) {
  const reload = () => load(undefined, true);
  const make = (text, body, primary) => {
    const b = el("button", { class: primary ? "primary" : "" }, text);
    b.onclick = async () => {
      b.disabled = true; b.textContent = "Saving\u2026";
      const res = await editCall({ vc_id: v.id, ...(body.action === "log" ? { occurred_on: localIso(0) } : {}), ...body });
      if (res) { savedToast(v, res, `${v.firm}: ${text}`, reload); reload(); }
      else { b.disabled = false; b.textContent = text; }
    };
    return b;
  };
  // "Next step" opens a small inline field on the card.
  const nextStep = (box) => {
    const b = el("button", {}, "Next step");
    b.onclick = () => {
      const input = el("input", { placeholder: "e.g. send the deck by Friday", maxlength: "200", style: "flex:1;min-width:150px" }); input.value = v.next_step || "";
      const save = el("button", { class: "primary" }, "Save"), cancel = el("button", {}, "Cancel");

      save.onclick = async () => { if (await editCall({ action: "next_step", vc_id: v.id, next_step: input.value })) { toast("Next step saved"); reload(); } };
      cancel.onclick = () => row.replaceWith(box);
      box.replaceWith(row); input.focus();

    return b;
  };
  // "Mark reached out" asks who, how, when and a note (all optional, sensible defaults), so the log is useful later.
  const reachOut = (box) => {

      const how = el("select", {}, CHANNELS.map(([k, t]) => el("option", { value: k }, t)));
      const when = el("select", {}, [[0, "Today"], [1, "Yesterday"], [2, "2 days ago"], [3, "3 days ago"], [7, "A week ago"]].map(([n, t]) => el("option", { value: String(n) }, `${t} \u00b7 ${fmtDate(localIso(n))}`)));
      const note = el("input", { placeholder: "Note (optional): what you said, what to remember", maxlength: "300" });
      const save = el("button", { class: "primary" }, "Save"), cancel = el("button", {}, "Cancel");
      const form = el("div", { class: "reachform" }, el("div", { class: "two" }, who, how), when, note, el("div", { class: "qa" }, save, cancel));
      cancel.onclick = () => form.replaceWith(box);
      save.onclick = async () => {
        save.disabled = true; save.textContent = "Saving\u2026";
        const res = await editCall({ action: "log", vc_id: v.id, kind: "reached_out", occurred_on: localIso(Number(when.value)), person: who.value, channel: how.value, note: note.value });
        if (res) { savedToast(v, res, `${v.firm}: marked reached out`, reload); reload(); } else { save.disabled = false; save.textContent = "Save"; }
      };
      box.replaceWith(form);
    };
    return b;
  };
  const log = (kind, extra = {}) => ({ action: "log", kind, ...extra });
  const sets = {
    reach: ["REACH"],
    warm: ["REACH"],
    dormant: ["REACH"],
    nudge: [["Followed up", log("follow_up"), true], ["They replied", log("replied")]],
    waiting: [["They replied", log("replied")]],
    talks: [["They approved", log("approved")], "NEXT"],
    approved: v.status === "closed"
      ? ["NEXT", ["Undo: back to approved", log("note", { status: "approved", note: "Closed undone: back to approved" })]]
      : [["Mark closed", log("closed"), true], "NEXT", ["Undo approval", log("note", { status: "in_conversation", note: "Approval undone: back to in talks" })]],
    declined: [["Revisit in 6 months", { action: "revisit" }], ["Undo decline", { action: "undo_decline" }]],
  };
  if (!sets[bucket]) return null;
  const box = el("div", { class: "qa" });
  box.append(...sets[bucket].map((e) => (e === "NEXT" ? nextStep(box) : e === "REACH" ? reachOut(box) : make(e[0], e[1], e[2]))));
  return box;
}

function column(title, hint, items, o = {}) {

  btn.onclick = () => { const open = rest.style.display === "none"; rest.style.display = open ? "block" : "none"; btn.textContent = open ? "Show top " + limit : `Show all ${items.length}`; };
  return el("div", attrs, head, sub, items.slice(0, limit), rest, btn);
}

// When this investor will next be searched. Mirrors the schedule in weights.yaml (pipeline 2d, reach-out 2d, dormant 7d)
// and the cron (Mon + Thu 01:30 UTC = 7:00 IST), so the date shown is a real run day.
const SCHEDULE_DAYS = { fast: 2, slow: 7 };
function nextSearch(v, now) {
  if (v.recommended_action === "skip" || v.status === "declined") return el("span", { class: "dim" }, "No search needed");
  const fast = ["waiting", "in_conversation", "approved", "closed"].includes(v.status) || ["reach_out", "nudge"].includes(v.recommended_action);
  const last = v.last_searched_at ? new Date(v.last_searched_at) : null;
  const due = last ? new Date(last.getTime() + SCHEDULE_DAYS[fast ? "fast" : "slow"] * 864e5 - 12 * 36e5) : now;
  const from = new Date(Math.max(due.getTime(), now.getTime()));
  for (let i = 0; i < 9; i++) {
    const run = new Date(Date.UTC(from.getUTCFullYear(), from.getUTCMonth(), from.getUTCDate() + i, 1, 30));
    if ([1, 4].includes(run.getUTCDay()) && run >= from) return run.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "Asia/Kolkata" });
  }
  return "\u2014";
}

// All investors in one searchable, filterable, sortable table: find any fund (even a dormant one) to check or log something.
function directory(data, now, hot) {
  const rows = data.vcs.map((v) => {
    const bucket = bucketOf(v, now, hot), people = peopleOfVc(v), { best } = signalsOf(v, data.evidence);
    return { v, bucket, people, best, text: [v.firm, v.thesis, v.geo, v.stage_focus, ...people.map((p) => p.name)].join(" ").toLowerCase() };

function peopleOf(d) {
  const m = new Map();
  const add = (name, patch) => { const k = name.toLowerCase(); m.set(k, { name, role: "", ...(m.get(k) || {}), ...Object.fromEntries(Object.entries(patch).filter(([, v]) => v)) }); };
  for (const p of d.people) add(p.name, { role: p.role, source_url: p.source_url, source_domain: p.source_domain, source_tier: p.source_tier, via: "found" });
  for (const e of d.evidence) if (e.person_name) add(e.person_name, { role: e.person_role, via: (m.get(e.person_name.toLowerCase()) || {}).via || "signal" });
  for (const c of d.contacts) add(c.name, { role: c.role, linkedin_url: c.linkedin_url, note: c.note, via: "manual" });
  return [...m.values()].map((p) => {
    const mine = d.evidence.filter((e) => (e.person_name || "").toLowerCase() === p.name.toLowerCase() && e.source_tier !== "legacy_unverified");

}

const REASON = {
  blocked_source: "low-quality source", social_source_disabled: "social post (not trusted)", untrusted_source: "source not on the trusted list",
  quote_not_on_page: "quote not found on the page", url_not_in_results: "link was not in the search results", wrong_firm: "page was about a different firm",
  wrong_person: "page didn't name the person", outside_window: "older than 30 days", no_api_date: "no publish date",
  duplicate_url: "duplicate", unknown_type: "unrecognised type", malformed: "malformed", person_check_failed: "a partner check failed",
  people_discovery_failed: "partner search failed",
};

function checkSummary(c) {
  const d = c.detail || {}, lines = [];
  const scoreLine = () => {
    if (d.score == null) return;
    const p = c._prev && c._prev.detail, base = `Timing score ${d.score}`;
    if (p && p.score != null && p.score !== d.score) {
      lines.push(`${base} (was ${p.score}): ` + (p.score_version !== d.score_version ? `scoring formula changed (v${p.score_version ?? 1} \u2192 v${d.score_version})` : "its signals aged or changed"));
    } else lines.push(base);
  };
  const outcome = !c.ok ? ["red", "Check failed"] : c.outcome === "signal" ? ["green", "Found activity"] : c.outcome === "skipped_fit" ? ["gray", "Skipped: not a fit"] : c.outcome === "rescored" ? ["gray", "Re-scored from saved signals"] : ["blue", "Search found nothing new"];
  if (!c.ok) lines.push(`${friendlyError(c.error)} this run, so the previous results were kept.`);
  else if (c.outcome === "skipped_fit") lines.push((d.reason || "Not a fit for this round") + ", so no searches were run.");
  else if (c.outcome === "rescored") lines.push(`Re-scored from ${d.signals_on_file ?? 0} saved signal${d.signals_on_file === 1 ? "" : "s"}. No search was made, so it cost nothing.`);
  else {
    const via = d.provider ? ` via ${d.provider}${d.searches != null ? ` (${d.searches} search${d.searches === 1 ? "" : "es"})` : ""}` : "";
    lines.push(d.pages_found != null ? `Searched ${d.pages_found} pages${via}, ${d.pages_usable} usable.` : `Searched ${c.n_pages} pages.`);
    const sk = Object.entries(d.skipped || {});
    if (sk.length) lines.push("Skipped untrusted sources: " + sk.map(([k, n]) => `${k} \u00d7${n}`).join(", ") + ".");
    if (d.undated) lines.push(`Ignored ${d.undated} page${d.undated > 1 ? "s" : ""} from trusted sources with no publish date (dates must come from the search API).`);
    if (c.n_signals) lines.push(`Kept ${c.n_signals} signal${c.n_signals > 1 ? "s" : ""}` + (d.signals_people ? ` (${d.signals_people} from partners)` : "") + ".");
    if (c.outcome === "no_signal") lines.push(d.signals_on_file ? `${plural(d.signals_on_file, "earlier signal")} still on file and still counted.` : "Signals found earlier stay on file and still count until they are 30 days old.");
    if (d.people_checked && d.people_checked.length) lines.push("Partners checked: " + d.people_checked.join(", ") + ".");
    const rj = {};
    for (const x of (c.dropped || [])) rj[x.reason] = (rj[x.reason] || 0) + 1;
    const rl = Object.entries(rj);
    if (rl.length) lines.push("Rejected by validation: " + rl.map(([r, n]) => `${REASON[r] || label(r)} \u00d7${n}`).join(", ") + ".");
  }
  scoreLine();
  return { outcome, lines };
}

function checksPanel(allChecks) {
  // Each entry can say how the score moved: compare with the next older entry that recorded a score.
  allChecks.forEach((c, i) => { c._prev = allChecks.slice(i + 1).find((o) => o.detail && o.detail.score != null) || null; });
  // Free re-scores are housekeeping, not checks: fold them into one collapsed line so real searches stand out.

// ================================================================ Map (the home page)
// The highest-priority investors as blocks: the bigger the block, the better the fit (with a bonus for a fresh signal).
// Green = reach out now (logistics signal within 14 days), yellow = warm (15-30 days), grey = no recent signal.
function mapWeight(v, bucket) {
  const fit = (v.fit_points ?? 0) * 10, timing = (v.follow_up_score ?? 0) / 5;
  return Math.max(12, Math.round(fit + timing + (bucket === "reach" ? 25 : bucket === "warm" ? 10 : 0)));
}

    `⚠ ${failed.length} of ${vcs.filter((v) => v.status === "to_contact").length} prospects couldn't be checked last run`,
    el("div", { style: "font-weight:400;margin-top:4px" }, `${failed.map((v) => v.firm).join(", ")}. Their earlier results are shown and marked stale until the next run.`)));
  if (run && run.error) out.push(el("div", { class: "notice" }, /credit|402/i.test(run.error) ? "Search credits ran out during the last run. Previous results were kept." : "The last run hit an error. Previous results were kept."));
  const age = run && run.finished_at ? daysAgo(new Date(run.finished_at), now) : null;

// ================================================================ Calendar
// Your schedule in one place: reach-out windows closing, follow-ups due, revisit dates, search runs, and the calls,
// meetings and reminders you add yourself. Automatic items come from the data; yours are saved in the database.
const KIND_LBL = { call: "Call", meeting: "Meeting", reminder: "Reminder", deadline: "Deadline", other: "Other" };
const calState = { mode: "2w", off: 0, formDate: null };
const isoLocal = (d) => d.toLocaleDateString("en-CA");
const addIso = (s, n) => { const [y, m, d] = s.split("-").map(Number); return isoLocal(new Date(y, m - 1, d + n)); };
const mondayOf = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };

function calendarEvents(data, now) {
  const by = new Map(), put = (d, e) => { if (!by.has(d)) by.set(d, []); by.get(d).push(e); };
  const today = isoLocal(now), hot = hotSet(data.evidence, now), firmOf = new Map(data.vcs.map((v) => [v.id, v.firm]));
  for (const v of data.vcs) {
    const b = bucketOf(v, now, hot);
    if (b === "reach") {
      const dates = data.evidence.filter((e) => e.vc_id === v.id && e.relevance === "logistics" && e.source_tier !== "legacy_unverified").map((e) => e.published_date);
      if (dates.length) { const closes = addIso(dates.sort().pop(), MAX_SIGNAL_AGE); if (closes >= today) put(closes, { kind: "close", text: `Window closes: ${v.firm}`, vc: v.id }); }
    } else if (b === "nudge") put(today, { kind: "follow", text: `Follow up overdue: ${v.firm}`, vc: v.id, overdue: true });
    else if (b === "waiting" && v.last_contacted_at) put(addIso(v.last_contacted_at, NUDGE_DAYS), { kind: "follow", text: `Follow up: ${v.firm}`, vc: v.id });
    if (v.status === "declined" && v.revisit_on) put(v.revisit_on, { kind: "revisit", text: `Revisit: ${v.firm}`, vc: v.id });
  }
  for (const e of data.events || []) put(e.on_date, { kind: "mine", sub: e.kind, manual: true, id: e.id, done: e.done, vc: e.vc_id,
    text: e.title + (e.vc_id && firmOf.has(e.vc_id) ? ` · ${firmOf.get(e.vc_id)}` : ""), note: e.note });
  return by;
}

function pill(e, reload) {
  const label = e.manual ? `${KIND_LBL[e.sub] || "Event"}: ${e.text}` : e.text;
  const main = e.vc ? el("a", { class: "pt", href: `#/vc/${e.vc}`, title: e.note || label }, label) : el("span", { class: "pt", title: e.note || label }, label);
  if (e.done) main.style.textDecoration = "line-through";
  const kids = [main];
  if (e.manual) {
    const ok = el("button", { title: e.done ? "Mark not done" : "Mark done", "aria-label": "Toggle done" }, "✓");
    ok.onclick = async () => { if (await editCall({ action: "toggle_event", event_id: e.id, done: !e.done })) reload(); };
    const del = el("button", { title: "Delete this event", "aria-label": "Delete event" }, "×");
    del.onclick = async () => { if (confirm("Delete this event?") && await editCall({ action: "delete_event", event_id: e.id })) { toast("Event deleted"); reload(); } };
    kids.push(el("span", { class: "px" }, ok, del));
  }
  return el("div", { class: `pill p-${e.kind}${e.overdue ? " overdue" : ""}` }, kids);
}

function renderCalendar(data) {
  const now = new Date(), todayIso = isoLocal(now), by = calendarEvents(data, now), g = groupVcs(data, now);
  const reload = () => load(undefined, true);
  const draw = () => renderCalendar(data);

  // The visible range: two weeks from this week, or the whole month.
  let start, days, label, monthOf = null;
  if (calState.mode === "2w") {
    start = mondayOf(now); start.setDate(start.getDate() + calState.off * 14); days = 14;
    const end = new Date(start); end.setDate(end.getDate() + 13);
    label = `${start.toLocaleDateString("en-GB", { day: "numeric", month: "short" })} – ${end.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}`;
  } else {
    const first = new Date(now.getFullYear(), now.getMonth() + calState.off, 1);
    monthOf = first.getMonth(); start = mondayOf(first);
    const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
    days = Math.ceil((((last - start) / 864e5) + 1) / 7) * 7;
    label = first.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  }

  const cells = [];
  for (let i = 0; i < days; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = isoLocal(d), evs = [...(by.get(iso) || [])];
    if ([1, 4].includes(d.getDay())) evs.push({ kind: "run", text: "Search run · 7:00" });
    const isToday = iso === todayIso, out = monthOf != null && d.getMonth() !== monthOf;
    const add = el("button", { class: "addb", title: `Add an event on ${fmtDate(iso)}`, "aria-label": `Add an event on ${iso}` }, "+");
    add.onclick = () => { calState.formDate = iso; draw(); };
    const shown = evs.slice(0, 3), hidden = evs.slice(3);
    const more = hidden.length ? el("button", { class: "morebtn" }, `+${hidden.length} more`) : null;
    const extra = el("div", { style: "display:none;flex-direction:column;gap:5px" }, hidden.map((e) => pill(e, reload)));
    if (more) more.onclick = () => { const open = extra.style.display === "none"; extra.style.display = open ? "flex" : "none"; more.textContent = open ? "Show less" : `+${hidden.length} more`; };
    cells.push(el("div", { class: `cell${isToday ? " today" : ""}${out ? " out" : ""}` },
      el("div", { class: "top2" }, el("span", { class: "dn" }, d.getDate() === 1 || i === 0 ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : String(d.getDate())), add),
      shown.map((e) => pill(e, reload)), extra, more));
  }

  const step = (n) => { calState.off += n; draw(); };
  const mk = (t, f, c) => { const b = el("button", { class: c || "navb" }, t); b.onclick = f; return b; };
  const seg = el("div", { class: "seg2" }, ["2w", "month"].map((m) => { const b = el("button", { class: calState.mode === m ? "on" : "" }, m === "2w" ? "2 weeks" : "Month"); b.onclick = () => { calState.mode = m; calState.off = 0; draw(); }; return b; }));
  const bar = el("div", { class: "calbar" }, el("h2", {}, label), seg,
    mk("←", () => step(-1)), mk("Today", () => { calState.off = 0; draw(); }), mk("→", () => step(1)),
    mk("+ Add event", () => { calState.formDate = todayIso; draw(); }, "navb"));

  // Add-event form
  let form = null;
  if (calState.formDate) {
    const title = el("input", { placeholder: "e.g. Intro call with Dynamo", maxlength: "120", required: "required" });
    const date = el("input", { type: "date" }); date.value = calState.formDate;
    const kind = el("select", {}, Object.entries(KIND_LBL).map(([k, t]) => el("option", { value: k }, t)));
    const inv = el("select", {}, [el("option", { value: "" }, "No investor")].concat([...data.vcs].sort((a, b) => a.firm.localeCompare(b.firm)).map((v) => el("option", { value: String(v.id) }, v.firm))));
    const note = el("input", { placeholder: "Optional note", maxlength: "500" });
    const save = el("button", { class: "primary" }, "Save event"), cancel = el("button", {}, "Cancel");
    cancel.onclick = () => { calState.formDate = null; draw(); };
    save.onclick = async () => {
      if (!title.value.trim() || !date.value) { title.focus(); return; }
      save.disabled = true; save.textContent = "Saving…";
      const res = await editCall({ action: "add_event", title: title.value, on_date: date.value, kind: kind.value, vc_id: inv.value ? Number(inv.value) : null, note: note.value });
      if (res) { calState.formDate = null; toast(`Added: ${title.value.trim()}`); reload(); } else { save.disabled = false; save.textContent = "Save event"; }
    };
    form = el("div", { class: "evform" },
      el("label", {}, "What", title), el("label", {}, "Date", date), el("label", {}, "Type", kind), el("label", {}, "Investor", inv),
      el("label", { class: "wide" }, "Note", note), el("div", { class: "wide chips" }, save, cancel));
  }

  // Today panel
  const todays = (by.get(todayIso) || []);
  const reachCards = g.reach.slice(0, 3).map((v) => card(v, data.evidence, now, "reach"));
  const warn = g.warm.length;
  const side = el("aside", { "aria-label": "Today" },
    el("h2", {}, `Today · ${now.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })}`),
    todays.length ? el("div", { class: "todaylist" }, todays.map((e) => pill(e, reload))) : el("p", { class: "sub", style: "margin:0 0 12px" }, "Nothing scheduled today."),
    reachCards.length ? [el("h2", { style: "font-size:16px" }, "Reach out"), reachCards] : null,
    warn ? el("p", { class: "sub" }, `${warn} warm investor${warn > 1 ? "s have" : " has"} no deadline. `, el("a", { href: "#/action", style: "color:var(--purple2)" }, "See warm →")) : null);

  show(...header(data, "calendar"), ...alerts(data, now),
    el("div", { class: "twocol" }, side,
      el("section", { class: "main", style: "flex:3 1 680px", "aria-label": "Calendar" }, bar, form,
        el("div", { class: "legend2" },
          el("span", {}, el("i", { style: "background:#fde1a8" }), "Window closes"), el("span", {}, el("i", { style: "background:#dfe7ff" }), "Follow up due"),
          el("span", {}, el("i", { style: "background:#ffd0d0" }), "Overdue"), el("span", {}, el("i", { style: "background:#f3d9ff" }), "Revisit"),
          el("span", {}, el("i", { style: "background:#bff2d2" }), "Your events"), el("span", {}, "Dashed = search run")),
        el("div", { class: "calwrap" }, el("div", { class: "cal" }, ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => el("div", { class: "dow" }, d)), cells)))));
}

// The database sleeps when idle and takes a few seconds to wake, so the first request after a quiet spell can
// fail once. Retry quietly a couple of times before showing an error, and offer a Retry button when it does.
async function fetchJson(url, tries = 3) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw Object.assign(new Error(`HTTP ${r.status}`), { status: r.status });
      return await r.json();
    } catch (e) { last = e; if (i < tries - 1) await new Promise((res) => setTimeout(res, 1000 * (i + 1))); }
  }
  throw last;
}

// Say what really failed: only a network or server error can be the database waking up. A page error is a bug.
const failBox = (title, retry, e) => el("div", { class: "insight bad" }, el("h3", {}, title),
  el("p", {}, e && e.status && e.status < 500 ? "The server rejected the request." : e && (e.status >= 500 || /failed to fetch|networkerror|load failed/i.test(e.message || ""))
    ? "The server or database did not answer. If it was idle it may still be waking up; this usually clears in a few seconds."
    : "This is an error in the page itself, not the database. Retrying will not help until it is fixed."),
  el("p", { class: "note" }, `Details: ${(e && e.message) || "network error"}`),
  el("button", { class: "primary", onclick: retry }, "Retry"));

async function load(view, quiet) {
  view = view || viewFromHash();
  if (!quiet) show(...skeleton());
  let data;
  try { data = await fetchJson("/api/pipeline"); }
  catch (e) { show(failBox("Could not load the pipeline", () => load(view), e)); return; }
  window.__people = buildPeopleIndex(data);
  try { ({ status: renderStatus, action: render, calendar: renderCalendar, map: renderMap }[view] || renderMap)(data); }
  catch (e) { console.error(e); show(failBox("The page hit a display error", () => load(view), e)); }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
