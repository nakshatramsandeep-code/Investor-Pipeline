<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investor Pipeline</title>
<style>
  :root {
    --bg: #0a0a0f; --panel: #14141b; --panel2: #1b1b24; --line: #262633; --text: #f3f3f7; --muted: #8d8da0;
    --purple: #7b5cff; --purple2: #b07bff; --green: #4ade80; --pink: #ff5fa2; --blue: #5b8cff; --amber: #f5b14a; --red: #ff7a7a;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 24px 20px 72px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .logo { width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, var(--purple), var(--purple2)); }
  h1 { font: 700 28px/1.1 var(--mono); margin: 0 0 6px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0; }
  .sub b { color: var(--text); font-weight: 600; }
  .hero { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: 14px; margin-bottom: 30px; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
  .insight { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .insight.bad { border-color: #5a2a2a; }
  .insight h3 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--pink); display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: #200; flex: none; }
  .insight p { margin: 0 0 12px; color: #c9c9d6; font-size: 13px; }
  .kpi { border-radius: 16px; padding: 16px; background: linear-gradient(135deg, #6b4df0 0%, #a46cf5 100%); display: grid; gap: 14px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; opacity: .9; margin-bottom: 6px; }
  .track { height: 8px; border-radius: 99px; background: rgba(255,255,255,.28); overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; background: #fff; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } }
  .tile { background: rgba(255,255,255,.16); border-radius: 12px; padding: 12px 14px; }
  .tile small { display: block; font-size: 12px; opacity: .85; }
  .tile strong { font: 700 22px/1.3 var(--mono); }
  .tile em { font-style: normal; font-size: 12px; opacity: .85; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
  .chip.good { color: var(--green); background: rgba(74,222,128,.1); border-color: rgba(74,222,128,.25); }
  .chip.warn { color: var(--amber); } .chip.bad { color: var(--red); }
  h2 { font: 600 18px var(--mono); margin: 0 0 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h2 small { font: 400 12px system-ui; color: var(--muted); }
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) { .board { grid-template-columns: 1fr; } }
  .col h4 { margin: 0 0 10px; font: 600 14px var(--mono); display: flex; justify-content: space-between; color: var(--text); }
  .col h4 span { color: var(--muted); font-weight: 400; }
  .col .hint { color: var(--muted); font-size: 12px; margin: -4px 0 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .card .name { font-weight: 650; font-size: 15px; }
  .card .meta { color: var(--muted); font-size: 12px; }
  .amount { font: 700 26px/1.2 var(--mono); margin: 8px 0 6px; }
  .pl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .pbar { height: 6px; border-radius: 99px; background: var(--panel2); overflow: hidden; }
  .pbar i { display: block; height: 100%; border-radius: 99px; }
  .why { margin: 10px 0 0; color: #cfcfdb; font-size: 13px; }
  .age { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .ev { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; font-size: 12px; }
  .ev q { display: block; color: var(--muted); margin: 3px 0 6px; }
  a { color: #9db6ff; }
  button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 8px; padding: 2px 9px; cursor: pointer; }
  button:hover { border-color: var(--purple); }
  button.on { background: var(--purple); border-color: var(--purple); }
  .mini { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; font-size: 13px; }
  .mini span:last-child { color: var(--muted); font-size: 12px; text-align: right; }
  .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; font-size: 13px; }
  .skipped { margin-top: 30px; }
  a.vclink { color: var(--text); text-decoration: none; }
  a.vclink:hover { color: #b9a7ff; text-decoration: underline; }
  .back { display: inline-block; margin-bottom: 14px; color: var(--muted); text-decoration: none; font-size: 13px; }
  .back:hover { color: var(--text); }
  .ph { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 18px; }
  .ph h1 { margin-bottom: 10px; }
  .big { font: 700 44px/1 var(--mono); }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 860px) { .pgrid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .panel.wide { grid-column: 1 / -1; }
  .panel h3 { margin: 0 0 12px; font: 600 15px var(--mono); }
  .person { padding: 10px 0; border-top: 1px solid var(--line); }
  .person:first-of-type { border-top: 0; padding-top: 0; }
  .person b { font-size: 15px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .note { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; border-top: 0; }
  .tier-own_site { color: var(--green); } .tier-news { color: var(--blue); } .tier-social { color: var(--amber); }
</style>
</head>
<body>
<main id="app"></main>
<script>
const app = document.getElementById("app");

// Everything from the database (including model-written summaries) is untrusted text: build DOM, never innerHTML.
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k === "onclick") n.onclick = v; else if (k === "style") n.style.cssText = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
}
const safeUrl = (u) => { try { const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:" ? x.href : null; } catch { return null; } };
const fmtDate = (d) => d ? new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "never";
const daysAgo = (d, now) => Math.max(0, Math.floor((now - new Date(d)) / 864e5));
const label = (s) => String(s || "").replace(/_/g, " ");
const scoreColor = (s) => s >= 70 ? "var(--green)" : s >= 40 ? "var(--blue)" : "var(--pink)";

async function sendFeedback(ev, useful, btns) {
  try {
    const r = await fetch("/api/feedback", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ evidence_id: ev.id, vc_id: ev.vc_id, useful }) });
    if (!r.ok) throw new Error(r.status);
    btns.forEach(([b, v]) => b.classList.toggle("on", v === useful));
  } catch { alert("Could not save feedback."); }
}

const TIER = { own_site: "Firm's own site", news: "News / press", social: "Social post", unlisted: "Unlisted source" };
function trustChip(e) {
  return e.source_tier ? el("span", { class: `chip tier-${e.source_tier}` }, `${TIER[e.source_tier] || e.source_tier}: ${e.source_domain}`) : null;
}

function evidenceRows(v, evidence) {
  return evidence.filter((e) => e.vc_id === v.id).map((e) => {
    const href = safeUrl(e.url);
    const up = el("button", { class: e.useful === true ? "on" : "" }, "Useful");
    const down = el("button", { class: e.useful === false ? "on" : "" }, "Not useful");
    const btns = [[up, true], [down, false]];
    up.onclick = () => sendFeedback(e, true, btns); down.onclick = () => sendFeedback(e, false, btns);
    return el("div", { class: "ev" },
      el("div", { class: "chips" }, el("span", { class: "chip" }, label(e.type)), el("span", { class: "chip" }, fmtDate(e.published_date)), trustChip(e)),
      el("q", {}, e.quote),
      href ? el("a", { href, target: "_blank", rel: "noopener noreferrer" }, "Check the source") : null, " ", up, " ", down);
  });
}

function card(v, evidence, now) {
  const score = v.follow_up_score ?? 0;
  const checked = v.checked_at ? daysAgo(v.checked_at, now) : null;
  const chips = [
    v.check_ok === false ? el("span", { class: "chip bad" }, "check failed: old values") : null,
    checked == null ? el("span", { class: "chip warn" }, "never checked") : checked > 5 ? el("span", { class: "chip warn" }, `checked ${checked}d ago`) : null,
    v.last_contacted_at ? el("span", { class: "chip" }, `contacted ${fmtDate(v.last_contacted_at)}`) : null,
    v.flag ? el("span", { class: "chip warn" }, v.flag) : null,
  ];
  return el("div", { class: "card" },
    el("div", { class: "name" }, el("a", { class: "vclink", href: `#/vc/${v.id}` }, v.firm)),
    el("div", { class: "meta" }, [v.geo, v.stage_focus].filter(Boolean).join(" · ")),
    el("div", { class: "amount" }, String(score)),
    el("div", { class: "pl" }, el("span", {}, "Follow-up score"), el("span", {}, `${score}%`)),
    el("div", { class: "pbar" }, el("i", { style: `width:${score}%;background:${scoreColor(score)}` })),
    el("p", { class: "why" }, v.signal_summary || "Not scored yet."),
    v.last_signal_date ? el("div", { class: "age" }, `Latest signal ${daysAgo(v.last_signal_date, now)}d ago`) : null,
    el("div", { class: "chips", style: "margin-top:8px" }, chips),
    evidenceRows(v, evidence));
}

function miniRow(v, text) {
  return el("div", { class: "mini" }, el("span", {}, el("a", { class: "vclink", href: `#/vc/${v.id}` }, v.firm), v.check_ok === false ? " ⚠" : ""), el("span", {}, text));
}

function hero(data, now) {
  const { run, vcs, evidence } = data;
  const top = vcs.filter((v) => v.recommended_action === "reach_out").sort((a, b) => b.follow_up_score - a.follow_up_score)[0];
  const failed = vcs.filter((v) => v.check_ok === false);
  const finished = run && run.finished_at ? new Date(run.finished_at) : null;
  const age = finished ? daysAgo(finished, now) : null;
  const stale = age != null && age > 4;

  let insight;
  if (failed.length || (run && run.error) || stale) {
    insight = el("div", { class: "insight bad" }, el("h3", {}, el("span", { class: "dot" }, "!"),
      failed.length ? `${failed.length} VC${failed.length > 1 ? "s" : ""} could not be checked` : "The last run needs attention"),
      el("p", {}, failed.length ? `Their scores are from an earlier run: ${failed.map((v) => v.firm).join(", ")}.` : (run && run.error) || `The last run finished ${age} days ago, older than the usual 3-4 day cycle. Re-run it from GitHub Actions.`));
  } else if (top) {
    const ev = evidence.find((e) => e.vc_id === top.id);
    insight = el("div", { class: "insight" }, el("h3", {}, el("span", { class: "dot" }, "1"), `Strongest signal: ${top.firm}`),
      el("p", {}, top.signal_summary),
      el("div", { class: "chips" }, el("span", { class: "chip good" }, "Source-checked"), el("span", { class: "chip good" }, `Score ${top.follow_up_score}`), ev ? el("span", { class: "chip" }, label(ev.type)) : null));
  } else {
    insight = el("div", { class: "insight" }, el("h3", {}, el("span", { class: "dot" }, "0"), "Nothing fresh this week"),
      el("p", {}, "No VC has a verified signal in the last 30 days. Don't force it."));
  }

  const checked = run ? run.vcs_checked : 0, total = run ? run.vcs_total : vcs.length;
  const pct = total ? Math.round(100 * checked / total) : 0;
  const count = (a) => vcs.filter((v) => v.recommended_action === a).length;
  const kpi = el("div", { class: "kpi" },
    el("div", {}, el("div", { class: "bar-label" }, el("span", {}, "VCs checked last run"), el("span", {}, `${pct}%`)), el("div", { class: "track" }, el("i", { class: "fill", style: `display:block;width:${pct}%` }))),
    el("div", { class: "tiles" },
      el("div", { class: "tile" }, el("small", {}, "Reach out"), el("strong", {}, String(count("reach_out"))), " ", el("em", {}, "this week")),
      el("div", { class: "tile" }, el("small", {}, "Signals kept"), el("strong", {}, String(run ? run.signals_kept : 0)), " ", el("em", {}, run ? `${run.signals_dropped} dropped` : "")),
      el("div", { class: "tile" }, el("small", {}, "Last run"), el("strong", {}, age == null ? (run ? "running" : "never") : age === 0 ? "today" : `${age}d ago`), " ", el("em", {}, run ? run.status : ""))));
  return el("div", { class: "hero" }, insight, kpi);
}

function column(title, hint, items) {
  return el("div", { class: "col" }, el("h4", {}, title, el("span", {}, String(items.length))), hint ? el("div", { class: "hint" }, hint) : null, items.length ? items.map((n) => n) : el("div", { class: "empty" }, "Nothing here."));
}

function render(data) {
  const now = new Date(data.now);
  const by = (a) => data.vcs.filter((v) => v.recommended_action === a).sort((x, y) => (y.follow_up_score ?? 0) - (x.follow_up_score ?? 0));
  const reach = by("reach_out"), nudge = by("nudge"), hold = by("hold"), quiet = by("quiet_list"), skip = by("skip");
  const unscored = data.vcs.filter((v) => !v.recommended_action).length;

  app.replaceChildren(
    el("div", { class: "brand" }, el("span", { class: "logo" }), "Investor Pipeline"),
    el("div", { class: "top" }, el("div", {},
      el("h1", {}, "Who to reach out to this week"),
      el("p", { class: "sub" }, el("b", {}, `${data.vcs.length} VCs`), ` tracked · signals from the last 30 days · every claim links to its source`))),
    hero(data, now),
    el("h2", {}, "Pipeline by action", el("small", {}, "Ranked by follow-up score")),
    el("div", { class: "board" },
      column("Reach out", "Fresh signal, not yet contacted", reach.map((v) => card(v, data.evidence, now))),
      column("Nudge", "Waiting on a reply, with a reason to follow up", nudge.map((v) => card(v, data.evidence, now))),
      column("Hold", "You already moved recently", hold.map((v) => card(v, data.evidence, now))),
      column("Quiet", "No signal in 30 days: don't spend energy here", quiet.map((v) => miniRow(v, v.check_ok === false ? "check failed" : v.stage_focus)))),
    el("div", { class: "skipped" }, el("h2", {}, "Skipped", el("small", {}, "Not a fit right now")),
      skip.length ? skip.map((v) => miniRow(v, (v.signal_summary || "").replace("Skipped: ", ""))) : el("div", { class: "empty" }, "None.")),
    unscored ? el("p", { class: "sub", style: "margin-top:20px" }, `${unscored} VCs have not been scored yet.`) : null);
}

function peopleFrom(evidence) {
  const m = new Map();
  for (const e of evidence) {
    if (!e.person_name) continue;
    const p = m.get(e.person_name) || { name: e.person_name, role: e.person_role, items: [] };
    p.role = p.role || e.person_role; p.items.push(e); m.set(e.person_name, p);
  }
  return [...m.values()].sort((a, b) => b.items.length - a.items.length);
}

function whoPanel(contacts, evidence) {
  const rows = [];
  for (const c of contacts) {
    const href = safeUrl(c.linkedin_url);
    rows.push(el("div", { class: "person" }, el("b", {}, c.name), c.role ? ` \u00b7 ${c.role}` : "", " ", el("span", { class: "chip good" }, "Added by you"),
      href ? el("div", {}, el("a", { href, target: "_blank", rel: "noopener noreferrer" }, "LinkedIn profile")) : null,
      c.note ? el("div", { class: "meta" }, c.note) : null));
  }
  for (const p of peopleFrom(evidence).filter((p) => !contacts.some((c) => c.name.toLowerCase() === p.name.toLowerCase()))) {
    const e = p.items[0], href = safeUrl(e.url);
    rows.push(el("div", { class: "person" }, el("b", {}, p.name), p.role ? ` \u00b7 ${p.role}` : "", " ", el("span", { class: "chip" }, "Named in a verified source"),
      el("div", { class: "meta" }, `${p.items.length} signal${p.items.length > 1 ? "s" : ""}, latest ${fmtDate(e.published_date)} (${label(e.type)})`),
      href ? el("div", {}, el("a", { href, target: "_blank", rel: "noopener noreferrer" }, `Source: ${e.source_domain}`)) : null));
  }
  return el("div", { class: "panel" }, el("h3", {}, "Who to reach out to"),
    rows.length ? rows : el("div", { class: "empty" }, "No person named yet. People appear here when a verified source names someone at the firm. You can add one in the vc_contacts table."),
    el("p", { class: "note" }, "Names come from the source page itself, never guessed. Emails are not shown here."));
}

function fitPanel(v) {
  const site = safeUrl(v.website), seed = safeUrl(v.source_url);
  const kv = [
    ["Thesis", v.thesis], ["Stage focus", v.stage_focus], ["Region", v.geo],
    ["Investing now", v.is_investing ? "Yes" : "No (paused)"],
    ["Website", site ? el("a", { href: site, target: "_blank", rel: "noopener noreferrer" }, site) : "Not added yet"],
  ];
  return el("div", { class: "panel" }, el("h3", {}, "Fit and background"),
    el("dl", { class: "kv" }, kv.flatMap(([k, val]) => [el("dt", {}, k), el("dd", {}, val)])),
    v.flag ? el("div", { class: "chips", style: "margin-top:10px" }, el("span", { class: "chip warn" }, v.flag)) : null,
    v.background ? el("p", { class: "note" }, `From your original list: ${v.background}. `, seed ? el("a", { href: seed, target: "_blank", rel: "noopener noreferrer" }, "list source") : null, " (not independently verified)") : null);
}

function relPanel(v, now) {
  const kv = [["Status", label(v.status)], ["Last contacted", v.last_contacted_at ? fmtDate(v.last_contacted_at) : "Not recorded"],
    ["Latest signal", v.last_signal_date ? `${fmtDate(v.last_signal_date)} (${daysAgo(v.last_signal_date, now)}d ago)` : "None yet"]];
  return el("div", { class: "panel" }, el("h3", {}, "Relationship"),
    el("dl", { class: "kv" }, kv.flatMap(([k, val]) => [el("dt", {}, k), el("dd", {}, val)])),
    el("p", { class: "note" }, "Your private notes and contact history stay in Neon and are not shown on this public page."));
}

function checksPanel(checks) {
  const rows = checks.map((c) => {
    const reasons = {};
    for (const d of (c.dropped || [])) reasons[d.reason] = (reasons[d.reason] || 0) + 1;
    return el("tr", {}, el("td", {}, new Date(c.checked_at).toLocaleDateString(undefined, { day: "numeric", month: "short" })),
      el("td", {}, c.ok ? label(c.outcome) : "failed"), el("td", {}, String(c.n_pages)), el("td", {}, String(c.n_signals)),
      el("td", {}, Object.keys(reasons).length ? el("div", { class: "chips" }, Object.entries(reasons).map(([r, n]) => el("span", { class: "chip" }, `${label(r)} \u00d7${n}`))) : "-"));
  });
  return el("div", { class: "panel wide" }, el("h3", {}, "Check history"),
    rows.length ? el("table", {}, el("tr", {}, ["Date", "Outcome", "Pages", "Kept", "Dropped by validation"].map((h) => el("th", {}, h))), rows) : el("div", { class: "empty" }, "Not checked yet."));
}

function signalRow(e) {
  const up = el("button", { class: e.useful === true ? "on" : "" }, "Useful");
  const down = el("button", { class: e.useful === false ? "on" : "" }, "Not useful");
  const b = [[up, true], [down, false]];
  up.onclick = () => sendFeedback(e, true, b); down.onclick = () => sendFeedback(e, false, b);
  const href = safeUrl(e.url);
  return el("div", { class: "ev" },
    el("div", { class: "chips" }, el("span", { class: "chip" }, label(e.type)), el("span", { class: "chip" }, fmtDate(e.published_date)), trustChip(e)),
    el("p", { class: "why" }, e.summary), el("q", {}, e.quote),
    href ? el("a", { href, target: "_blank", rel: "noopener noreferrer" }, "Check the source") : null, " ", up, " ", down);
}

function renderProfile(d) {
  const v = d.vc, now = new Date(d.now), score = v.follow_up_score ?? 0;
  app.replaceChildren(
    el("a", { class: "back", href: "#/" }, "\u2190 Back to pipeline"),
    el("div", { class: "ph" },
      el("div", {}, el("h1", {}, v.firm),
        el("div", { class: "chips" }, el("span", { class: "chip good" }, label(v.recommended_action || "not scored")), el("span", { class: "chip" }, label(v.status)),
          el("span", { class: "chip" }, v.geo), el("span", { class: "chip" }, v.stage_focus)),
        el("p", { class: "sub", style: "margin-top:10px;max-width:640px" }, v.signal_summary || "Not scored yet.")),
      el("div", { style: "min-width:200px" }, el("div", { class: "big" }, String(score)),
        el("div", { class: "pl" }, el("span", {}, "Follow-up score"), el("span", {}, `${score}%`)),
        el("div", { class: "pbar" }, el("i", { style: `width:${score}%;background:${scoreColor(score)}` })))),
    el("div", { class: "pgrid" },
      whoPanel(d.contacts, d.evidence), relPanel(v, now),
      el("div", { class: "panel wide" }, el("h3", {}, `Signals (${d.evidence.length})`),
        d.evidence.length ? d.evidence.map(signalRow) : el("div", { class: "empty" }, "No verified signal from a trusted source yet.")),
      fitPanel(v), el("div", {}), checksPanel(d.checks)));
  window.scrollTo(0, 0);
}

async function loadProfile(id) {
  app.replaceChildren(el("p", { class: "sub" }, "Loading..."));
  try {
    const r = await fetch(`/api/vc?id=${id}`);
    if (!r.ok) throw new Error(r.status);
    renderProfile(await r.json());
  } catch {
    app.replaceChildren(el("a", { class: "back", href: "#/" }, "\u2190 Back to pipeline"),
      el("div", { class: "insight bad" }, el("h3", {}, "Could not load this investor"), el("p", {}, "Try again in a minute.")));
  }
}

function route() {
  const m = location.hash.match(/^#\/vc\/(\d+)$/);
  return m ? loadProfile(Number(m[1])) : load();
}

async function load() {
  app.replaceChildren(el("p", { class: "sub" }, "Loading..."));
  try {
    const r = await fetch("/api/pipeline");
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch {
    app.replaceChildren(el("div", { class: "insight bad" }, el("h3", {}, "Could not load the pipeline"), el("p", {}, "Try again in a minute.")));
  }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
