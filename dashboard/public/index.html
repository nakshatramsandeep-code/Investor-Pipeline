<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investor Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Geist:wght@400..700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --panel: #14141b; --panel2: #1b1b24; --line: #262633; --text: #f3f3f7; --muted: #a9a9be;
    --purple: #7b5cff; --purple2: #b07bff; --green: #4ade80; --pink: #ff5fa2; --blue: #5b8cff; --amber: #f5b14a; --red: #ff7a7a;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 24px 20px 72px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .logo { width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, var(--purple), var(--purple2)); }
  h1 { font: 700 28px/1.1 var(--mono); margin: 0 0 6px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0; }
  .sub b { color: var(--text); font-weight: 600; }
  .hero { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: 14px; margin-bottom: 30px; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
  .insight { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .insight.bad { border-color: #5a2a2a; }
  .insight h3 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--pink); display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: #200; flex: none; }
  .insight p { margin: 0 0 12px; color: #c9c9d6; font-size: 13px; }
  .kpi { border-radius: 16px; padding: 16px; background: linear-gradient(135deg, #6b4df0 0%, #a46cf5 100%); display: grid; gap: 14px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; opacity: .9; margin-bottom: 6px; }
  .track { height: 8px; border-radius: 99px; background: rgba(255,255,255,.28); overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; background: #fff; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } }
  .tile { background: rgba(255,255,255,.16); border-radius: 12px; padding: 12px 14px; }
  .tile small { display: block; font-size: 12px; opacity: .85; }
  .tile strong { font: 700 22px/1.3 var(--mono); }
  .tile em { font-style: normal; font-size: 12px; opacity: .85; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
  .chip.good { color: var(--green); background: rgba(74,222,128,.1); border-color: rgba(74,222,128,.25); }
  .chip.warn { color: var(--amber); } .chip.bad { color: var(--red); }
  h2 { font: 600 18px var(--mono); margin: 0 0 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h2 small { font: 400 12px system-ui; color: var(--muted); }
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) { .board { grid-template-columns: 1fr; } }
  .col h4 { margin: 0 0 10px; font: 600 14px var(--mono); display: flex; justify-content: space-between; color: var(--text); }
  .col h4 span { color: var(--muted); font-weight: 400; }
  .col .hint { color: var(--muted); font-size: 12px; margin: -4px 0 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .card .name { font-weight: 650; font-size: 15px; }
  .card .meta { color: var(--muted); font-size: 12px; }
  .amount { font: 700 26px/1.2 var(--mono); margin: 8px 0 6px; }
  .pl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .pbar { height: 6px; border-radius: 99px; background: var(--panel2); overflow: hidden; }
  .pbar i { display: block; height: 100%; border-radius: 99px; }
  .why { margin: 10px 0 0; color: #cfcfdb; font-size: 13px; }
  .age { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .ev { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; font-size: 12px; }
  .ev q { display: block; color: var(--muted); margin: 3px 0 6px; }
  a { color: #9db6ff; }
  button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 8px; padding: 2px 9px; cursor: pointer; }
  button:hover { border-color: var(--purple); }
  button.on { background: var(--purple); border-color: var(--purple); }
  .mini { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; font-size: 13px; }
  .mini span:last-child { color: var(--muted); font-size: 12px; text-align: right; }
  .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; font-size: 13px; }
  .skipped { margin-top: 30px; }
  a.vclink { color: var(--text); text-decoration: none; }
  a.vclink:hover { color: #b9a7ff; text-decoration: underline; }
  .back { display: inline-block; margin-bottom: 14px; color: var(--muted); text-decoration: none; font-size: 13px; }
  .back:hover { color: var(--text); }
  .ph { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 18px; }
  .ph h1 { margin-bottom: 10px; }
  .big { font: 700 44px/1 var(--mono); }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 860px) { .pgrid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .panel.wide { grid-column: 1 / -1; }
  .panel h3 { margin: 0 0 12px; font: 600 15px var(--mono); }
  .person { padding: 10px 0; border-top: 1px solid var(--line); }
  .person:first-of-type { border-top: 0; padding-top: 0; }
  .person b { font-size: 15px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .note { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; border-top: 0; }
  .chip.c-green { color: #4ade80; background: rgba(74,222,128,.12); border-color: rgba(74,222,128,.32); }
  .chip.c-amber { color: #f5b14a; background: rgba(245,177,74,.12); border-color: rgba(245,177,74,.32); }
  .chip.c-blue { color: #7aa7ff; background: rgba(91,140,255,.13); border-color: rgba(91,140,255,.34); }
  .chip.c-purple { color: #b9a4ff; background: rgba(123,92,255,.15); border-color: rgba(123,92,255,.38); }
  .chip.c-teal { color: #3ddbd9; background: rgba(61,219,217,.11); border-color: rgba(61,219,217,.3); }
  .chip.c-red { color: #ff8a8a; background: rgba(255,122,122,.12); border-color: rgba(255,122,122,.32); }
  .chip.c-gray { color: #b8b8cc; }
  .board.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 1250px) { .board.five { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 800px) { .board.five { grid-template-columns: 1fr; } }
  .chip { white-space: nowrap; }
  .notice { border: 1px solid #5a2a2a; background: rgba(255,122,122,.07); color: #ffb3b3; border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 10px; }
  .insight.best { display: flex; flex-direction: column; gap: 8px; }
  .insight.best .row { align-items: center; flex-wrap: nowrap; }
  .insight.best h3 { margin: 0; }
  .insight.best p { margin: 0; }
  .bestname { font: 700 24px/1.2 var(--mono); }
  .bestname a { color: var(--text); text-decoration: none; }
  .bestname a:hover { color: #b9a7ff; }
  .insight.best .score { font: 700 28px var(--mono); color: var(--green); }
  .dot.ok { background: var(--green); }
  .insight.best a.more { margin-top: auto; }
  .row { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
  .card.compact { padding: 10px 12px; margin-bottom: 8px; }
  .card.compact .row { align-items: center; flex-wrap: nowrap; gap: 8px; }
  .card.compact .name { font-size: 14px; }
  .pts { font: 700 16px var(--mono); flex: none; }
  .why.one { margin: 6px 0 0; font-size: 12.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.compact .qa { margin-top: 8px; }
  .card.compact .qa button { padding: 1px 8px; }
  button.showall { width: 100%; margin-top: 4px; padding: 6px; color: var(--muted); }
  .board.auto { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .sk { background: linear-gradient(90deg, var(--panel) 25%, var(--panel2) 50%, var(--panel) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 12px; }
  @keyframes sh { to { background-position: -200% 0; } }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #04210f; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 9; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  .runline { font-size: 12px; color: rgba(255,255,255,.85); }
  .kpi h3 { margin: 0; font: 600 15px var(--mono); }
  .tile.click { cursor: default; }
  .tile strong { font-size: 26px; }
  details.sec { margin-top: 26px; }
  details.sec > summary { cursor: pointer; font: 600 16px var(--mono); list-style: none; display: flex; gap: 10px; align-items: baseline; }
  details.sec > summary::before { content: "\25b8"; color: var(--muted); }
  details.sec[open] > summary::before { content: "\25be"; }
  details.sec > summary small { font: 400 12px system-ui; color: var(--muted); }
  .sec input.filter { margin: 12px 0 10px; width: 260px; max-width: 100%; font: inherit; font-size: 13px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .quiet.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 14px; }
  .emptyline { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
  .card.compact .meta { margin-top: 4px; font-size: 12px; }
  .pts { font-size: 18px; }
  .qa button.primary { padding: 4px 12px; font-weight: 600; }
  ul.bullets { margin: 10px 0 0; padding-left: 18px; max-width: 680px; color: var(--muted); font-size: 14px; }
  ul.bullets li { margin-bottom: 4px; }
  .tiles.four { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 560px) { .tiles.four { grid-template-columns: repeat(2, 1fr); } }
  .namerow { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .namerow h1 { margin: 0; }
  .vlogo { width: 52px; height: 52px; border-radius: 13px; flex: none; }
  img.vlogo { background: #fff; object-fit: contain; padding: 7px; }
  .vlogo.initials { display: grid; place-items: center; background: linear-gradient(135deg, var(--purple), var(--purple2)); color: #fff; font: 700 18px var(--mono); }
  button.seemore { margin-top: 4px; color: var(--muted); }
  .hero { align-items: stretch; }
  .kpi { align-content: space-between; }
  .tile.click { cursor: pointer; transition: background .15s; }
  .tile.click:hover { background: rgba(255,255,255,.26); }
  .legend { font-size: 12px; color: var(--muted); margin: -14px 0 22px; }
  .legend b { font-weight: 600; }
  .warnbox { border: 1px solid rgba(245,177,74,.45); background: rgba(245,177,74,.08); color: #f7c97a; border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
  .statusblock { min-width: 210px; text-align: right; }
  .statusblock .big { font-size: 22px; }
  .statusblock .sub2 { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .next { margin-top: 6px; font-size: 12.5px; color: #dcdcf0; }
  .card.compact .meta.warn { color: #f7c97a; }
  .toast { display: flex; align-items: center; gap: 12px; }
  .toastbtn { background: rgba(0,0,0,.18); border: 0; color: #04210f; font-weight: 700; padding: 3px 10px; border-radius: 7px; cursor: pointer; }
  .toastbtn:hover { background: rgba(0,0,0,.3); }
  .fitnote { color: var(--muted); font-size: 12.5px; margin: -6px 0 14px; }
  details.notice > summary { cursor: pointer; list-style: none; }
  details.notice > summary::before { content: "\25b8  "; }
  details.notice[open] > summary::before { content: "\25be  "; }
  details.notice p { margin: 6px 0 0 14px; color: #f0b9b9; font-size: 12.5px; }
  button.linkbtn { border: 0; background: none; color: #b9a7ff; padding: 0 0 0 8px; font-size: 12px; cursor: pointer; text-decoration: underline; }
  button.delbtn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; float: right; }
  button.delbtn:hover { color: var(--red); }
  .tbl { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  .tbl .inner { min-width: 1240px; }
  .trow { display: grid; grid-template-columns: var(--cols); gap: 12px; padding: 10px 14px; align-items: center; border-top: 1px solid var(--line); font-size: 13px; }
  .trow.head { background: var(--panel2); color: var(--muted); font-weight: 600; font-size: 12px; border-top: 0; border-radius: 12px 12px 0 0; }
  .trow .vc b { display: block; font-size: 14px; } .trow .vc a { color: var(--text); text-decoration: none; } .trow .vc a:hover { color: #b9a7ff; }
  .trow .vc small { color: var(--muted); }
  .trow .dim { color: var(--muted); }
  .trow .qa { margin: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 12px; }
  .toolbar input, .toolbar select { font: inherit; font-size: 13px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .toolbar input { flex: 1; min-width: 220px; }
  .toolbar .count { color: var(--muted); font-size: 12.5px; }
  .coverage { font-size: 12px; color: rgba(255,255,255,.9); margin-top: 4px; }
  .coverage.warn { color: #ffe3a8; }
  .reachform { display: grid; gap: 8px; width: 100%; margin-top: 4px; }
  .reachform .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .reachform select, .reachform input { font: inherit; font-size: 13px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
  .suggested { margin-top: 4px; font-size: 12.5px; color: #dcdcf0; }
  .tabs { display: flex; gap: 6px; margin: 0 0 18px; }
  .tabs a { padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); text-decoration: none; font-size: 13px; }
  .tabs a.on { background: var(--purple); border-color: var(--purple); color: #fff; }
  .tier-legacy_unverified { color: var(--red); border-color: rgba(255,122,122,.4); }
  .form { display: grid; gap: 8px; }
  .form label { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
  .form input, .form select, .form textarea { font: inherit; font-size: 13px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
  .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button.primary { background: var(--purple); border-color: var(--purple); padding: 6px 14px; font-size: 13px; }
  .tl { border-left: 2px solid var(--line); padding-left: 12px; margin: 0 0 10px 4px; font-size: 13px; }
  .tl small { color: var(--muted); }
  a.more { display: inline-block; margin-top: 10px; font-size: 12px; color: #b9a7ff; text-decoration: none; }
  a.more:hover { text-decoration: underline; }
  .qa { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tier-own_site { color: var(--green); } .tier-news { color: var(--blue); } .tier-social { color: var(--amber); }

  /* ---- Map (home) and Calendar views */
  .tabs a.cal-tab { border-color: var(--purple2); color: #fff; }
  .legend2 { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .legend2 i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 8px; vertical-align: -2px; }
  .twocol { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .twocol > .main { flex: 3 1 640px; min-width: 0; }
  .twocol > aside { flex: 1 1 340px; max-width: 440px; min-width: 0; }
  aside h2 { font: 700 20px var(--mono); margin: 0 0 12px; }
  .tm { display: flex; flex-direction: column; gap: 6px; height: 640px; }
  .tm-row { display: flex; gap: 6px; min-height: 0; }
  .tm-tile { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 14px 16px;
    border-radius: 14px; min-width: 0; min-height: 84px; overflow: hidden; text-decoration: none; transition: transform .12s, filter .12s; }
  .tm-tile:hover { filter: brightness(.93); transform: translateY(-2px); }
  .tm-tile:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .tm-tile.reach { background: #6fe39f; color: #052612; }
  .tm-tile.warm { background: #ffc94d; color: #3d2600; }
  .tm-tile.dorm { background: #dfe3ea; color: #1f2733; }
  .tm-tile .tn { font-weight: 800; letter-spacing: -.02em; line-height: 1.05; overflow-wrap: anywhere; }
  .tm-tile .tb { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; width: 100%; font-size: 13px; font-weight: 600; }
  .tm-tile .tb span { white-space: nowrap; }
  .tm-tile .tb b { font: 700 15px var(--mono); }
  @media (max-width: 760px) { .tm { height: auto; } .tm-row { flex: none !important; flex-direction: column; } .tm-tile { flex: none !important; } .twocol > .main { flex-basis: 100%; } }
  .calbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 12px; }
  .calbar h2 { margin: 0; flex: 1 1 200px; }
  .seg2 { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg2 button { background: transparent; border: 0; color: var(--muted); padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg2 button.on { background: var(--purple); color: #fff; }
  .navb { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .navb:hover { border-color: var(--purple2); }
  .calwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); min-width: 780px; }
  .cal .dow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .cal .cell { min-height: 126px; padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .cal > :nth-child(7n) { border-right: 0; }
  .cell.today { background: rgba(123,92,255,.13); }
  .cell.out { opacity: .42; }
  .cell .top2 { display: flex; align-items: center; justify-content: space-between; }
  .cell .dn { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 14px; font: 700 13px var(--mono); }
  .cell.today .dn { background: #f3f3f7; color: #0a0a0f; }
  .cell .addb { opacity: 0; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; width: 24px; height: 24px; cursor: pointer; line-height: 1; }
  .cell:hover .addb, .cell .addb:focus-visible { opacity: 1; }
  .pill { font-size: 12.5px; font-weight: 600; line-height: 1.3; padding: 5px 8px; border-radius: 8px; display: flex; gap: 6px; align-items: flex-start; justify-content: space-between; }
  .pill .pt { color: inherit; text-decoration: none; min-width: 0; overflow-wrap: anywhere; }
  .pill a.pt:hover { text-decoration: underline; }
  .pill.p-close { background: #fde1a8; color: #5e3400; }
  .pill.p-follow { background: #dfe7ff; color: #1b2f8f; }
  .pill.p-follow.overdue { background: #ffd0d0; color: #7a1010; }
  .pill.p-revisit { background: #f3d9ff; color: #4b1a6b; }
  .pill.p-mine { background: #bff2d2; color: #0b3a1f; }
  .pill.p-run { background: transparent; color: var(--muted); border: 1px dashed var(--line); font-weight: 500; }
  .pill .px { display: inline-flex; gap: 2px; flex: none; }
  .pill .px button { border: 0; background: rgba(0,0,0,.12); color: inherit; border-radius: 5px; width: 20px; height: 20px; line-height: 1; cursor: pointer; font-size: 12px; }
  .pill .px button:hover { background: rgba(0,0,0,.28); }
  .morebtn { background: transparent; border: 0; color: var(--muted); font: inherit; font-size: 12px; text-align: left; padding: 0 2px; cursor: pointer; text-decoration: underline; }
  .evform { background: var(--panel); border: 1px solid var(--purple); border-radius: 16px; padding: 16px; margin-bottom: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
  .evform label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .evform input, .evform select { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px; min-height: 38px; }
  .evform .wide { grid-column: 1 / -1; }
  .todaylist { display: grid; gap: 6px; margin: 4px 0 14px; }

  /* ================================================================ LIGHT THEME (overrides everything above)
     Palette and shapes follow the design references: soft grey page, white cards with thin borders, ink buttons,
     Bricolage Grotesque for headings, Geist for text, Geist Mono for numbers. */
  :root {
    --bg: #f2f3f5; --panel: #ffffff; --panel2: #eceef2; --line: #dfe2e8; --text: #0e1116; --muted: #5b6270;
    --purple: #0e1116; --purple2: #2447d6; --green: #0f8a4b; --pink: #c2255c; --blue: #2447d6; --amber: #b4690e; --red: #c53030;
    --mono: "Geist Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --display: "Bricolage Grotesque", "Geist", system-ui, sans-serif;
  }
  body { font: 15px/1.5 "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding-top: 0; }
  a { color: #2447d6; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid #3d5afe; outline-offset: 2px; }
  h1 { font: 800 42px/1.05 var(--display); letter-spacing: -.03em; margin: 0 0 8px; }
  h2, .col h4, .panel h3, .insight h3, .kpi h3, details.sec > summary, aside h2 { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; }
  h2 { font-size: 20px; }
  h2 small, details.sec > summary small, .legend, .sub { font-family: "Geist", system-ui, sans-serif; }
  .sub { font-size: 15px; }
  .sub b { color: var(--text); }

  /* top bar: white, full width, with the tabs and a search box */
  .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 28px; background: #fff; border-bottom: 1px solid var(--line);
    margin: 0 0 28px; padding: 0; box-shadow: 0 0 0 100vmax #fff; clip-path: inset(0 -100vmax); min-height: 62px; }
  .brand2 { display: flex; align-items: center; gap: 10px; font-size: 16px; }
  .brand2 b { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; font-size: 18px; }
  .logo { background: #0e1116; position: relative; }
  .logo::after { content: ""; position: absolute; inset: 7px 7px 7px 7px; border-radius: 4px; background: #6fe39f; clip-path: polygon(0 0, 55% 0, 55% 100%, 0 100%); }
  .topbar .tabs { margin: 0; gap: 26px; align-self: stretch; }
  .tabs a, .tabs a.cal-tab { padding: 0; border: 0; border-bottom: 3px solid transparent; border-radius: 0; display: inline-flex; align-items: center; min-height: 62px;
    font-weight: 600; font-size: 15px; color: var(--muted); background: transparent; }
  .tabs a:hover { color: var(--text); }
  .tabs a.on { background: transparent; color: var(--text); border-bottom-color: #3d5afe; }
  .gsearch { margin-left: auto; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border: 1.5px solid #cdd2dc; border-radius: 12px; background: #fff; min-width: 260px; }
  .gsearch input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: var(--text); outline-offset: 6px; }
  .top { margin-bottom: 20px; }

  /* cards and panels */
  .card, .insight, .panel, .mini, .tbl, .empty, .calwrap { background: #fff; border-color: var(--line); }
  .card, .insight, .panel { border-radius: 16px; }
  .card { box-shadow: 0 1px 0 rgba(14,17,22,.03); }
  .card:hover { border-color: #c9ceda; }
  .insight p, .why, .next, .suggested { color: #3a4152; }
  .insight.bad { border-color: #f2b8b8; background: #fff6f6; }
  .empty { background: transparent; }
  .kpi { background: #0e1116; color: #fff; }
  .kpi .tile { background: rgba(255,255,255,.1); }
  .tile.click:hover { background: rgba(255,255,255,.2); }
  .runline { color: rgba(255,255,255,.8); }
  .insight.best { border: 1.5px solid #0e1116; }
  .dot { background: #0e1116; color: #fff; }
  .dot.ok { background: #6fe39f; color: #052612; }
  .insight.best .score { color: var(--text); }
  .bestname a:hover, a.vclink:hover, .trow .vc a:hover { color: #2447d6; }
  a.more, button.linkbtn { color: #2447d6; }

  /* buttons: ink outline, fill on hover; primary is solid ink */
  button { font-weight: 600; font-size: 13px; border: 1.5px solid #0e1116; background: #fff; color: #0e1116; border-radius: 10px; padding: 4px 12px; }
  button:hover { background: #0e1116; color: #fff; border-color: #0e1116; }
  button.on, button.primary { background: #0e1116; color: #fff; border-color: #0e1116; }
  button.primary:hover, button.on:hover { background: #262c38; }
  button:disabled { opacity: .55; cursor: default; }
  .qa button.primary { padding: 5px 14px; }
  button.showall, button.seemore, button.delbtn, button.linkbtn, .morebtn, .toastbtn { border: 0; background: transparent; }
  button.showall { border: 1px dashed var(--line); color: var(--muted); width: 100%; }
  button.showall:hover, button.seemore:hover { background: var(--panel2); color: var(--text); }
  button.delbtn:hover, button.linkbtn:hover, .morebtn:hover { background: transparent; }
  .navb, .seg2 button { font-weight: 600; }
  .navb { background: #fff; border: 1.5px solid #0e1116; color: #0e1116; }
  .navb:hover { background: #0e1116; color: #fff; }
  .seg2 { border: 1.5px solid #0e1116; }
  .seg2 button { border: 0; border-radius: 0; background: #fff; color: #0e1116; padding: 6px 14px; }
  .seg2 button.on { background: #0e1116; color: #fff; }
  .seg2 button:hover { background: #eceef2; color: #0e1116; }
  .seg2 button.on:hover { background: #262c38; color: #fff; }
  .cell .addb { border: 1px solid var(--line); color: var(--muted); background: #fff; padding: 0; }
  .cell .addb:hover { background: #0e1116; color: #fff; }
  .pill .px button { border: 0; padding: 0; color: inherit; background: rgba(0,0,0,.1); }
  .pill .px button:hover { background: rgba(0,0,0,.25); color: inherit; }
  .toast { background: #0e1116; color: #fff; box-shadow: 0 8px 28px rgba(14,17,22,.25); }
  .toastbtn { color: #6fe39f; background: rgba(255,255,255,.12); }
  .toastbtn:hover { background: rgba(255,255,255,.24); color: #6fe39f; }

  /* inputs */
  .toolbar input, .toolbar select, .form input, .form select, .form textarea, .reachform select, .reachform input,
  .sec input.filter, .evform input, .evform select { background: #fff; border: 1.5px solid #cdd2dc; color: var(--text); border-radius: 10px; }
  .toolbar input:focus, .form input:focus, .form textarea:focus { border-color: #3d5afe; }
  .evform { border: 1.5px solid #0e1116; }

  /* chips: soft tinted backgrounds, dark text */
  .chip { background: #eceef2; border: 0; color: #262c38; border-radius: 8px; padding: 2px 10px; font-weight: 600; font-size: 12.5px; }
  .chip.c-green, .chip.good { background: #d6f5e3; color: #0b5d33; }
  .chip.c-amber, .chip.warn { background: #fdeccd; color: #7a4b00; }
  .chip.c-blue { background: #dfe7ff; color: #1b2f8f; }
  .chip.c-purple { background: #e8e6ff; color: #3a2fb0; }
  .chip.c-teal { background: #d3f2f0; color: #0b5f5c; }
  .chip.c-red, .chip.bad { background: #ffdada; color: #8f1b1b; }
  .chip.c-gray { background: #eceef2; color: #3a4152; }
  .tier-legacy_unverified { background: #ffdada; color: #8f1b1b; border: 0; }
  .notice { border: 1px solid #f2b8b8; background: #fff2f2; color: #8f1b1b; }
  details.notice p { color: #8f1b1b; }
  .warnbox { border: 1px solid #f0c36d; background: #fff6e5; color: #7a4b00; }
  .card.compact .meta.warn { color: #7a4b00; }
  .fitnote, .legend, .note { color: var(--muted); }

  /* tables and lists */
  .trow.head { background: #f6f7f9; }
  .mini { border-radius: 10px; }
  .tl { border-left-color: #c9ceda; }
  img.vlogo { border: 1px solid var(--line); }
  .vlogo.initials { background: #0e1116; }
  .sk { background: linear-gradient(90deg, #eceef2 25%, #f6f7f9 50%, #eceef2 75%); background-size: 200% 100%; }

  /* map and calendar */
  .tm-tile:focus-visible { outline: 3px solid #0e1116; }
  .tm-tile.dorm { background: #dfe3ea; }
  .cell.today { background: #eef2ff; }
  .cell.today .dn { background: #0e1116; color: #fff; }
  .calwrap, .cal { background: #fff; }
  .cell { border-color: #e6e9f2; }
  .cal .dow { border-bottom-color: var(--line); }
  .legend2 { color: var(--muted); }
  .pill.p-run { border-color: #cdd2dc; }

  @media (max-width: 760px) { .gsearch { margin-left: 0; width: 100%; } .topbar { padding-bottom: 8px; } h1 { font-size: 34px; } }

  .hero.one { grid-template-columns: 1fr; }
  .sumline { font: 700 20px var(--display); margin: 0 0 14px; letter-spacing: -.01em; }
  .sumline small { font: 400 14px "Geist", system-ui, sans-serif; color: var(--muted); }
  .fitwhy { margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .else { margin: 26px 0 0; font-size: 15px; color: var(--muted); }
  .else a { font-weight: 700; }
  .board.auto > div > details.sec { margin-top: 10px; }
  .board.auto > div > details.sec .quiet.cols { grid-template-columns: 1fr; }

  /* By action: queue + detail */
  .qd { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .qd { grid-template-columns: 1fr; } }
  .qd-left, .qd-right { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .qd-right { padding: 24px 28px 28px; min-height: 420px; }
  .qd-left h2 { font: 800 26px var(--display); letter-spacing: -.02em; margin: 0 0 2px; display: block; }
  .qsum { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .qgroup { margin-bottom: 8px; }
  .qlabel { display: flex; justify-content: space-between; font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 6px 6px; border-top: 1px solid #eceef2; }
  .qgroup:first-of-type .qlabel { border-top: 0; }
  .qrow { display: block; width: 100%; text-align: left; font-weight: 400; background: transparent; border: 1.5px solid transparent; border-radius: 12px; padding: 9px 10px; color: var(--text); }
  .qrow:hover { background: #f4f5f8; color: var(--text); border-color: transparent; }
  .qrow.sel { border-color: #0e1116; background: #fff; }
  .qr1 { display: flex; align-items: center; gap: 8px; }
  .qr1 b { font-size: 14.5px; font-weight: 700; }
  .qr1 .chip { font-size: 11px; padding: 0 8px; }
  .qage { margin-left: auto; font: 600 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .qage.hot { color: #c53030; }
  .qsub { color: var(--muted); font-size: 12.5px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .qfolds { border-top: 1px solid #eceef2; margin-top: 8px; padding-top: 6px; }
  .qfold { display: flex; width: 100%; justify-content: space-between; align-items: center; background: transparent; border: 0; border-radius: 10px; padding: 10px 8px; font: 600 14px "Geist", system-ui, sans-serif; color: var(--text); text-decoration: none; cursor: pointer; }
  .qfold:hover { background: #f4f5f8; color: var(--text); }
  .qfold small { color: var(--muted); font: 500 12px var(--mono); }
  .qtop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .qeye { font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .qnavs { display: flex; gap: 8px; }
  .qnav { width: 38px; height: 38px; border-radius: 50%; padding: 0; font-size: 20px; line-height: 1; border: 1.5px solid #cdd2dc; background: #fff; color: var(--text); }
  .qnav:hover { background: #0e1116; color: #fff; border-color: #0e1116; }
  .qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 20px; border-bottom: 1px solid #eceef2; }
  .qname { font: 800 38px/1.05 var(--display); letter-spacing: -.03em; margin: 0; display: block; }
  .qsec { padding: 20px 0; border-bottom: 1px solid #eceef2; }
  .qsec:last-child { border-bottom: 0; padding-bottom: 0; }
  .qsec .qeye { margin-bottom: 10px; }
  .qwhy { font: 500 21px/1.35 "Geist", system-ui, sans-serif; margin: 0; letter-spacing: -.01em; max-width: 60ch; }
  .qmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .qmeta a { color: var(--text); font-weight: 600; }
  .qwho { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #e6e9ff; color: #2a3bb5; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: none; }
  .qpills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .qpill { font-family: "Geist", system-ui, sans-serif; border-radius: 999px; padding: 8px 16px; font-size: 14px; border: 1.5px solid #cdd2dc; }
  .qpill:hover { background: #f4f5f8; color: var(--text); border-color: #0e1116; }
  .qpill.on { background: #0e1116; color: #fff; border-color: #0e1116; }
  .qpill.on:hover { background: #262c38; color: #fff; }
  .qact { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  button.big { padding: 12px 24px; font-size: 15px; border-radius: 999px; font-family: "Geist", system-ui, sans-serif; }

  /* investor profile, queue-and-detail style */
  .prof { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
  @media (max-width: 980px) { .prof { grid-template-columns: 1fr; } }
  .prof-main, .prof-side { display: grid; gap: 16px; min-width: 0; }
  .pcard { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; }
  .phrow { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .qhead2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 10px; }
  .prof .panel { border-radius: 18px; padding: 20px 22px; }
  .prof .panel h3 { font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
  .prof .ph, .prof .pgrid { display: block; }
  .qlink { color: inherit; text-decoration: none; }
  .qlink:hover { text-decoration: underline; text-underline-offset: 3px; }
  .qrow { cursor: pointer; }
  .qkv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 14px; margin: 0; font-size: 14px; }

  .qfit { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
  .qfit .ok { color: #0b5d33; } .qfit .bad { color: #8a5a00; }
  .qmore { padding: 10px 0; border-top: 1px solid #eceef2; font-size: 14px; }
  .qmore:first-of-type { border-top: 0; padding-top: 0; }

  /* My pipeline: clean table */
  .fpills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .fpill { border-radius: 999px; padding: 7px 16px; font-size: 14px; border: 1.5px solid #cdd2dc; background: #fff; color: var(--text); }
  .fpill small { font: 500 12px var(--mono); opacity: .7; }
  .fpill:hover { background: #f4f5f8; color: var(--text); border-color: #0e1116; }
  .fpill.on { background: #0e1116; color: #fff; border-color: #0e1116; }
  .fpill.on:hover { background: #262c38; color: #fff; }
  .tb2 { margin-bottom: 14px; }
  .tsearch { flex: 1; min-width: 240px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1.5px solid #cdd2dc; border-radius: 12px; background: #fff; }
  .tsearch input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: var(--text); padding: 0; outline-offset: 8px; }
  .tb2 select { height: 44px; border-radius: 12px; border: 1.5px solid #cdd2dc; background: #fff; padding: 0 12px; }

  .thead { font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-top: 16px; padding-bottom: 12px; }
  .trw { border-top: 1px solid #eceef2; }
  .trw:first-child { border-top: 0; }
  .tinv a { font-weight: 700; font-size: 15px; }
  .tsub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tdim { color: var(--muted); font-size: 13.5px; }
  .spill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 11px 2px 9px; font-size: 12.5px; font-weight: 600; background: #fff; }
  .spill i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .d-green { background: #0f8a4b; } .d-teal { background: #0f8a8a; } .d-amber { background: #d9951a; } .d-blue { background: #3d5afe; } .d-gray { background: #9aa1ad; }
  .tfit { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .tfit i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .tact-cell { display: flex; justify-content: flex-end; }
  .tact { border-radius: 999px; padding: 7px 18px; font-size: 13.5px; border: 1.5px solid #cdd2dc; background: #fff; color: var(--text); white-space: nowrap; }
  .tact:hover { background: #0e1116; color: #fff; border-color: #0e1116; }
  .tlink { font-size: 13.5px; font-weight: 600; color: var(--text); text-underline-offset: 3px; }
  .trow-x { padding: 0 22px 16px; max-width: 560px; margin-left: auto; }
  .tmore { display: flex; justify-content: center; padding: 14px; border-top: 1px solid #eceef2; }
  .tmore:empty { display: none; }
  .showmore { border-radius: 999px; padding: 8px 22px; font-size: 14px; border: 1.5px solid #cdd2dc; }

  /* modal, typeahead, view toggle */
  .modal-bg { position: fixed; inset: 0; background: rgba(14,17,22,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .modal { background: #fff; border-radius: 20px; padding: 26px 28px; width: min(520px, 100%); max-height: 92vh; overflow: auto; box-shadow: 0 24px 60px rgba(14,17,22,.35); display: grid; gap: 14px; }
  .mtitle { font: 800 28px/1.1 var(--display); letter-spacing: -.02em; margin: -6px 0 0; display: block; }
  .mlab { display: grid; gap: 6px; font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .mlab select, .mlab input, .mlab textarea { font: 400 14px "Geist", system-ui, sans-serif; letter-spacing: 0; text-transform: none; color: var(--text); background: #fff; border: 1.5px solid #cdd2dc; border-radius: 10px; padding: 9px 11px; width: 100%; }

  .tlink-btn { border: 0; background: transparent; text-decoration: underline; text-underline-offset: 3px; padding: 0 6px; }
  .tlink-btn:hover { background: transparent; color: var(--muted); }

  .ta-item { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }

</style>
</head>
<body>
<main id="app"></main>
<script>
const app = document.getElementById("app");
const show = (...nodes) => app.replaceChildren(...nodes.flat(Infinity).filter((n) => n != null && n !== false));

// Everything from the database (including model-written summaries) is untrusted text: build DOM, never innerHTML.
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k === "onclick") n.onclick = v; else if (k === "style") n.style.cssText = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
}
const safeUrl = (u) => { try { const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:" ? x.href : null; } catch { return null; } };
const fmtDate = (d) => d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }) : "never";
// Dates are the user's LOCAL calendar days. A date-only value ("2026-10-12") is a calendar day, so it is compared
// to today's local date, not to a UTC timestamp; a timestamp is compared by elapsed time.
const localIso = (daysBack = 0) => { const t = new Date(); t.setDate(t.getDate() - daysBack); return t.toLocaleDateString("en-CA"); };
const isDateOnly = (d) => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d);
const daysAgo = (d, now) => {
  if (isDateOnly(d)) {
    const [y, m, dd] = d.split("-").map(Number);
    const a = new Date(y, m - 1, dd), b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.max(0, Math.round((b - a) / 864e5));
  }
  return Math.max(0, Math.floor((now - new Date(d)) / 864e5));
};
const label = (s) => String(s || "").replace(/_/g, " ");
const LBL = {
  status: { to_contact: "Prospect", waiting: "Contacted", in_conversation: "In talks", approved: "Approved", closed: "Closed", declined: "Declined" },
  action: { reach_out: "Reach out now", nudge: "Follow up", hold: "Hold", quiet_list: "Dormant", skip: "Not a fit" },
  type: { portfolio_investment: "New investment", fund_announcement: "Fund news", interview: "Interview", blog_post: "Blog post", event_appearance: "Event / talk", other: "Other" },
};
const COL = {
  status: { to_contact: "purple", waiting: "amber", in_conversation: "blue", approved: "green", closed: "green", declined: "red" },
  action: { reach_out: "green", nudge: "amber", hold: "blue", quiet_list: "gray", skip: "red" },
  type: { portfolio_investment: "green", fund_announcement: "purple", interview: "blue", blog_post: "teal", event_appearance: "amber", other: "gray" },
};
// One name for each stage, used by the queue, the table, the filters, the map and the profile.
const LABELS = { reach: "Reach out", pitch: "Pitch on thesis", warm: "Warm", nudge: "Follow up due", waiting: "Contacted", talks: "In talks", approved: "Approved",
  closed: "Closed", declined: "Declined", park: "Parked", dormant: "Dormant", skip: "Not a fit", find: "More to pitch" };
const BUCKET = Object.fromEntries(Object.entries({ reach: "green", warm: "purple", pitch: "teal", park: "gray", nudge: "amber", waiting: "blue", talks: "blue",
  approved: "green", closed: "green", declined: "red", dormant: "gray", skip: "red" }).map(([k, c]) => [k, [LABELS[k], c]]));
const btag = (b) => el("span", { class: `chip c-${BUCKET[b][1]}` }, BUCKET[b][0]);
const relChip = (e) => e.relevance === "logistics" ? el("span", { class: "chip c-green" }, "Logistics") : e.relevance ? el("span", { class: "chip c-gray" }, "General activity") : null;
const tag = (kind, v) => v ? el("span", { class: `chip c-${COL[kind][v] || "gray"}` }, LBL[kind][v] || label(v)) : null;
// Fit (is this fund a good target?) and timing (is there a fresh reason to write now?) are shown separately, never blended.
const FIT = { high: ["High fit", "green"], medium: ["Medium fit", "amber"], low: ["Low fit", "gray"], excluded: ["Not a fit", "red"] };
const FITRANK = { high: 0, medium: 1, low: 2 };
const fitRank = (v) => FITRANK[v.fit_level] ?? 1;
const fitChip = (v) => v.fit_level && FIT[v.fit_level] ? el("span", { class: `chip c-${FIT[v.fit_level][1]}`, title: [...(v.fit_good || []), ...(v.fit_concerns || [])].join(" \u00b7 ") || "Fit rating" }, FIT[v.fit_level][0]) : null;
const timingOf = (v, hot) => hot && hot.has(v.id) ? ["Hot", "green"] : hot && hot.logi && hot.logi.has(v.id) ? ["Warm", "purple"] : ["Cold", "gray"];
const timingChip = (v, hot) => { const [t, c] = timingOf(v, hot); return el("span", { class: `chip c-${c}`, title: "Timing: is there a fresh logistics signal?" }, `Timing: ${t}`); };
const scoreColor = (s) => s >= 70 ? "var(--green)" : s >= 40 ? "var(--blue)" : "var(--pink)";

async function sendFeedback(ev, useful, btns) {
  try {
    const r = await fetch("/api/feedback", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ evidence_id: ev.id, vc_id: ev.vc_id, useful }) });
    if (!r.ok) throw new Error(r.status);
    btns.forEach(([b, v]) => b.classList.toggle("on", v === useful));
  } catch { alert("Could not save feedback."); }
}

const TIER = { own_site: "Firm's own site", news: "News / press", social: "Social post", unlisted: "Unlisted source", legacy_unverified: "Unverified source" };
function trustChip(e) {
  return e.source_tier ? el("span", { class: `chip tier-${e.source_tier}` }, `${TIER[e.source_tier] || e.source_tier}: ${e.source_domain}`) : null;
}

// ---- one set of rules for where an investor belongs. Driven by YOUR status and dates, so logging
// ---- an action moves the card immediately; scores and signals still come from the last run.
const NUDGE_DAYS = 7;        // keep in step with routing.waiting_nudge_days in weights.yaml
const MIN_REACH = 35;        // keep in step with routing.reach_out_min_score
const MAX_SIGNAL_AGE = 14;   // keep in step with routing.reach_out_max_signal_age_days

// Days until the freshest logistics signal falls out of the "reach out" window (null if there is none).
function coolsIn(v, evidence, now) {
  const ages = evidence.filter((e) => e.vc_id === v.id && e.relevance === "logistics" && e.source_tier !== "legacy_unverified").map((e) => daysAgo(e.published_date, now));
  return ages.length ? MAX_SIGNAL_AGE - Math.min(...ages) : null;
}
const waitDays = (v, now) => v.last_contacted_at ? daysAgo(v.last_contacted_at, now) : null;
// Investors with a logistics signal fresh enough to justify a cold approach.
// hot = a logistics signal fresh enough to justify a cold approach; hot.logi = any logistics signal in the 30-day window.
function hotSet(evidence, now) {
  const logi = evidence.filter((e) => e.relevance === "logistics" && e.source_tier !== "legacy_unverified");
  const hot = new Set(logi.filter((e) => daysAgo(e.published_date, now) <= MAX_SIGNAL_AGE).map((e) => e.vc_id));
  hot.logi = new Set(logi.map((e) => e.vc_id));
  return hot;
}
const friendlyError = (e) => /gemini|empty response|json/i.test(e || "") ? "The AI step failed" : /exa|search|http|network/i.test(e || "") ? "The search service was unavailable" : "The check did not finish";

function bucketOf(v, now, hot) {
  let status = v.status;
  const revisitDue = status === "declined" && v.revisit_on && v.revisit_on <= localIso(0);
  if (revisitDue) status = "to_contact";
  if (status === "declined") return "declined";
  if (status === "closed") return "closed";
  if (status === "approved") return "approved";
  if (status === "in_conversation") return "talks";
  if (status === "waiting") { const d = waitDays(v, now); return d == null || d >= NUDGE_DAYS ? "nudge" : "waiting"; }
  if (v.recommended_action === "skip" && !revisitDue) return "skip";
  if (v.recommended_action === "reach_out" && (v.follow_up_score ?? 0) >= MIN_REACH && hot.has(v.id)) return "reach";
  // Not a reach-out now. Fit decides where it goes: a low-fit fund is parked (news or not), a good-fit fund with an
  // older logistics signal is warm, and a high-fit fund with no news at all is pitched on its thesis.
  const logi = hot.logi && hot.logi.has(v.id);
  if (v.fit_level === "low") return logi ? "park" : "dormant";
  if (logi) return "warm";
  return v.fit_level === "high" ? "pitch" : "dormant";
}

function groupVcs(data, now) {
  const hot = hotSet(data.evidence, now);
  const g = { reach: [], warm: [], pitch: [], park: [], nudge: [], waiting: [], talks: [], approved: [], closed: [], declined: [], dormant: [], skip: [] };
  for (const v of data.vcs) g[bucketOf(v, now, hot)].push(v);
  const byFirm = (a, b) => a.firm.localeCompare(b.firm);
  const byFit = (a, b) => fitRank(a) - fitRank(b) || (b.follow_up_score ?? 0) - (a.follow_up_score ?? 0) || byFirm(a, b);   // best fit first, then best timing
  g.reach.sort((a, b) => (a.check_ok === false) - (b.check_ok === false) || byFit(a, b));
  g.nudge.sort((a, b) => (waitDays(b, now) ?? 999) - (waitDays(a, now) ?? 999));          // longest silence first
  g.waiting.sort((a, b) => (waitDays(b, now) ?? 0) - (waitDays(a, now) ?? 0));
  g.talks.sort((a, b) => (b.last_contacted_at || "") < (a.last_contacted_at || "") ? -1 : 1);
  for (const k of ["approved", "closed", "declined", "skip"]) g[k].sort(byFirm);
  g.warm.sort(byFit);
  // With no fresh signal to rank on, rank by how well the fund fits: level, then points, then any timing.
  for (const k of ["pitch", "park", "dormant"]) g[k].sort((a, b) => fitRank(a) - fitRank(b) || (b.fit_points ?? 0) - (a.fit_points ?? 0) || (b.follow_up_score ?? 0) - (a.follow_up_score ?? 0) || byFirm(a, b));
  return g;
}

const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const CHANNELS = [["email", "Email"], ["linkedin", "LinkedIn"], ["warm_intro", "Warm intro"], ["phone", "Phone"], ["event", "In person / event"], ["other", "Other"]];
const ROLE_ORDER = [[/founder/i, 0], [/managing/i, 1], [/general partner/i, 2], [/partner/i, 3]];
const roleRank = (r) => (ROLE_ORDER.find(([re]) => re.test(r || "")) || [0, 9])[1];

// People at each firm: contacts you added first, then those named on trusted pages. Kept globally so cards can use them.
function buildPeopleIndex(data) {
  const m = new Map(), put = (id, c) => { if (!m.has(id)) m.set(id, []); m.get(id).push(c); };
  for (const c of data.contacts || []) put(c.vc_id, { ...c, manual: true });
  for (const p of data.people || []) put(p.vc_id, { ...p, manual: false });
  return m;
}
const peopleOfVc = (v) => (window.__people && window.__people.get(v.id)) || [];

// The partner worth writing to: one YOU added; else the one named on this firm's LOGISTICS signals; else the most
// senior. `leads` says whether there is logistics evidence for them (so the card never implies it when there isn't).
function bestContact(v, evidence) {
  const logi = evidence.filter((e) => e.vc_id === v.id && e.relevance === "logistics" && e.person_name && e.source_tier !== "legacy_unverified");
  const count = (name) => logi.filter((e) => e.person_name.toLowerCase() === name.toLowerCase()).length;
  const ranked = [...peopleOfVc(v)].sort((a, b) => (b.manual - a.manual) || (count(b.name) - count(a.name)) || (roleRank(a.role) - roleRank(b.role)));
  const top = ranked[0];
  return top ? { ...top, leads: count(top.name) > 0 } : null;
}

function signalsOf(v, evidence) {
  const all = evidence.filter((e) => e.vc_id === v.id && e.source_tier !== "legacy_unverified")
    .sort((a, b) => (b.relevance === "logistics") - (a.relevance === "logistics") || (a.published_date < b.published_date ? 1 : -1));
  return { all, best: all[0] };
}

// A toast, optionally with an Undo button that stays for a few seconds longer.
function toast(text, undo) {
  const t = el("div", { class: "toast" }, text);
  let timer;
  if (undo) {
    const b = el("button", { class: "toastbtn" }, "Undo");
    b.onclick = async () => { clearTimeout(timer); t.remove(); await undo(); };
    t.append(b);
  }
  document.body.append(t);
  timer = setTimeout(() => t.remove(), undo ? 9000 : 2600);
}

// After any logged action: confirm it, and offer to put everything back exactly as it was.
function savedToast(v, res, text, reload) {
  toast(text, res && res.id ? async () => {
    if (await editCall({ action: "undo_log", vc_id: v.id, interaction_id: res.id, prev: res.prev })) { toast("Undone"); reload(); }
  } : null);
}

// One-click actions that make sense for where the investor is.
function quickActions(v, bucket) {
  const reload = () => load(undefined, true);
  const make = (text, body, primary) => {
    const b = el("button", { class: primary ? "primary" : "" }, text);
    b.onclick = async () => {
      b.disabled = true; b.textContent = "Saving\u2026";
      const res = await editCall({ vc_id: v.id, ...(body.action === "log" ? { occurred_on: localIso(0) } : {}), ...body });
      if (res) { savedToast(v, res, `${v.firm}: ${text}`, reload); reload(); }
      else { b.disabled = false; b.textContent = text; }
    };
    return b;
  };
  const reachOut = () => { const b = el("button", { class: "primary" }, "Mark reached out"); b.onclick = () => openLogModal(v, "reached_out"); return b; };
  const log = (kind, extra = {}) => ({ action: "log", kind, ...extra });
  const sets = {
    reach: ["REACH"],
    warm: ["REACH"],
    pitch: ["REACH"],
    park: ["REACH"],
    dormant: ["REACH"],
    nudge: [["Followed up", log("follow_up"), true], ["They replied", log("replied")]],
    waiting: [["They replied", log("replied")]],
    talks: [["They approved", log("approved")]],
    approved: [["Mark closed", log("closed"), true], ["Undo approval", log("note", { status: "in_conversation", note: "Approval undone: back to in talks" })]],
    closed: [["Undo: back to approved", log("note", { status: "approved", note: "Closed undone: back to approved" })]],
    declined: [["Revisit in 6 months", { action: "revisit" }], ["Undo decline", { action: "undo_decline" }]],
  };
  if (!sets[bucket]) return null;
  const box = el("div", { class: "qa" });
  box.append(...sets[bucket].map((e) => (e === "REACH" ? reachOut() : make(e[0], e[1], e[2]))));
  return box;
}

// One line on why this fund is (or is not) a good target: the main worry for medium/low fit, the main strengths for high.
function fitReason(v) {
  const good = (v.fit_good || []).slice(0, 2).join(" \u00b7 "), worry = (v.fit_concerns || [])[0];
  return v.fit_level === "high" ? good : worry || good;
}

// The card for someone you have not contacted: name, fit, one "why now" line, who to write to, and the button.
function prospectCard(v, evidence, now, bucket) {
  const { best } = signalsOf(v, evidence), contact = bestContact(v, evidence);
  const cool = bucket === "reach" ? coolsIn(v, evidence, now) : null;
  let why;
  if (bucket === "pitch" || !best) why = `No news in 30 days. Pitch on their thesis: ${v.thesis}`;
  else why = `${daysAgo(best.published_date, now)}d ago: ${best.summary}` + (cool != null && cool <= 3 ? ` (window closes ${cool <= 0 ? "today" : "in " + plural(cool, "day")})` : "")
    + (v.check_ok === false && bucket === "reach" ? " (older data: last check failed)" : "");
  return el("div", { class: "card compact" },
    el("div", { class: "row" }, el("a", { class: "vclink name", href: `#/vc/${v.id}` }, v.firm), fitChip(v)),
    fitReason(v) ? el("div", { class: "meta fitwhy" }, fitReason(v)) : null,
    el("p", { class: "why one" }, why),
    el("div", { class: "meta" }, contact ? ["Contact: ", el("b", {}, contact.name), contact.role ? ` \u00b7 ${contact.role}` : ""] : "No contact found yet"),
    quickActions(v, bucket));
}

function card(v, evidence, now, bucket) {
  if (["reach", "warm", "pitch", "park"].includes(bucket)) return prospectCard(v, evidence, now, bucket);
  const { all, best } = signalsOf(v, evidence), score = v.follow_up_score ?? 0, d = waitDays(v, now);
  const due = v.last_contacted_at ? fmtDate(new Date(new Date(v.last_contacted_at).getTime() + NUDGE_DAYS * 864e5).toISOString()) : null;
  const meta = {
    nudge: d == null ? "Contacted \u00b7 no date recorded \u00b7 no reply" : `Contacted ${d}d ago \u00b7 no reply`,
    waiting: `Contacted ${d}d ago \u00b7 follow up on ${due}`,
    talks: d == null ? "In talks" : `In talks \u00b7 last contact ${d}d ago`,
    approved: (v.status === "closed" ? "Deal closed" : "Committed to invest") + (d == null ? "" : ` \u00b7 last contact ${d}d ago`),
    declined: (d == null ? "Declined" : `Declined ${d}d ago`) + (v.revisit_on ? ` \u00b7 revisit ${fmtDate(v.revisit_on)}` : ""),
  }[bucket] || null;
  const showSignal = (bucket === "reach" || bucket === "warm") && best;
  const thesisLine = bucket === "pitch" ? `Thesis: ${v.thesis}` : bucket === "park" ? (v.fit_concerns && v.fit_concerns[0]) || "Weaker fit for a Seed logistics-SaaS pitch" : null;
  const contact = showSignal ? bestContact(v, evidence) : null;
  const logi = all.filter((e) => e.relevance === "logistics"), cool = showSignal && bucket === "reach" ? coolsIn(v, evidence, now) : null;
  return el("div", { class: "card compact" },
    el("div", { class: "row" }, el("a", { class: "vclink name", href: `#/vc/${v.id}` }, v.firm),
      ["reach", "warm", "pitch", "park"].includes(bucket) ? fitChip(v)
        : bucket === "nudge" ? el("span", { class: "chip c-amber" }, d == null ? "overdue" : `${d} days`) : null),
    meta ? el("div", { class: "meta" }, meta) : null,
    thesisLine ? el("div", { class: "meta" }, thesisLine) : null,
    bucket === "pitch" ? el("div", { class: "meta" }, `No logistics news in 30 days, so lead with their thesis. ${(v.fit_good || []).join(" \u00b7 ")}`) : null,
    showSignal || (v.check_ok === false && bucket === "reach") ? el("div", { class: "chips", style: "margin-top:6px" },
      showSignal ? [el("span", { class: "chip", title: "Timing score out of 100: how fresh and deal-like the signals are. Fit is not included.", style: `color:${scoreColor(score)}` }, `Timing ${score}`), tag("type", best.type), relChip(best), el("span", { class: "chip" }, `${daysAgo(best.published_date, now)}d ago`),
        el("span", { class: "chip c-green", title: "Signals about logistics, in the last 30 days" }, plural(logi.length, "logistics signal")),
        all.length > logi.length ? el("span", { class: "chip", title: "Other fund activity, not about logistics" }, `+${all.length - logi.length} other`) : null,
        cool != null && cool <= 3 ? el("span", { class: "chip c-amber", title: "After this the signal is too old to justify a cold approach" }, cool <= 0 ? "Last day in window" : `Cools in ${plural(cool, "day")}`) : null] : null,
      v.check_ok === false && bucket === "reach" ? el("span", { class: "chip c-red", title: "The last check failed, so this is older data" }, "stale") : null) : null,
    showSignal ? el("p", { class: "why one" }, best.summary) : null,
    showSignal && contact ? el("div", { class: "meta" }, (contact.leads ? "Leads logistics deals: " : "Contact: "), el("b", {}, contact.name), contact.role ? ` \u00b7 ${contact.role}` : "") : null,
    quickActions(v, bucket));
}

function miniRow(v, text) {
  return el("div", { class: "mini", "data-name": v.firm.toLowerCase() }, el("span", {}, el("a", { class: "vclink", href: `#/vc/${v.id}` }, v.firm), v.check_ok === false ? " \u26a0" : ""), el("span", {}, text));
}

// ---- top panel: what to do first, and the counts that matter
function pickFocus(g) {
  const fresh = (v) => v.check_ok !== false;
  const n = g.nudge.find(fresh); if (n) return { v: n, bucket: "nudge" };
  const r = g.reach.find(fresh); if (r) return { v: r, bucket: "reach" };
  return null;
}

function hero(data, now, g, focus) {
  const { run, vcs, evidence } = data;
  // Only prospects care: a failed check just means an older score, which doesn't matter once you've contacted them.
  const failed = vcs.filter((v) => v.check_ok === false && v.status === "to_contact");
  const finished = run && run.finished_at ? new Date(run.finished_at) : null;
  const age = finished ? daysAgo(finished, now) : null;
  const notices = [];
  const failedNote = failed.length ? el("div", { class: "notice", style: "font-weight:600" },
    `⚠ ${failed.length} of ${vcs.filter((v) => v.status === "to_contact").length} prospects couldn't be checked last run`,
    el("div", { style: "font-weight:400;margin-top:4px" }, `${failed.map((v) => v.firm).join(", ")}. ` +
      (run && run.error && /credit|402/i.test(run.error) ? "Search credits ran out. " : "The search provider returned an error. ") +
      "Their earlier results are shown and marked stale until the next run.")) : null;
  if (run && run.error) notices.push(/credit/i.test(run.error) ? "Search credits ran out during the last run. Top up Exa, then re-run it from GitHub Actions. Previous results were kept." : "The last run hit an error. Previous results were kept.");
  if (age != null && age > 4) notices.push(`The last run finished ${age} days ago, older than the usual 3-4 day cycle. Re-run it from GitHub Actions.`);

  let insight;
  if (focus) {
    const v = focus.v, { best } = signalsOf(v, evidence), d = waitDays(v, now);
    const title = focus.bucket === "nudge" ? "Do this first: follow up" : "Do this first: reach out";
    const line = focus.bucket === "nudge" ? `Contacted ${d == null ? "a while ago" : d + " days ago"} with no reply. ` : "";
    insight = el("div", { class: "insight best" },
      el("div", { class: "row" }, el("h3", {}, el("span", { class: "dot ok" }, "1"), title),
        focus.bucket === "reach" ? fitChip(v) : null),
      el("div", { class: "bestname" }, el("a", { class: "vclink", href: `#/vc/${v.id}` }, v.firm)),
      el("p", {}, line, best ? best.summary : ""),
      quickActions(v, focus.bucket),

function peopleOf(d) {
  const m = new Map();
  const add = (name, patch) => { const k = name.toLowerCase(); m.set(k, { name, role: "", ...(m.get(k) || {}), ...Object.fromEntries(Object.entries(patch).filter(([, v]) => v)) }); };
  for (const p of d.people) add(p.name, { role: p.role, source_url: p.source_url, source_domain: p.source_domain, source_tier: p.source_tier, via: "found" });
  for (const e of d.evidence) if (e.person_name) add(e.person_name, { role: e.person_role, via: (m.get(e.person_name.toLowerCase()) || {}).via || "signal" });
  for (const c of d.contacts) add(c.name, { role: c.role, linkedin_url: c.linkedin_url, note: c.note, via: "manual" });
  return [...m.values()].map((p) => {

// ================================================================ Header search: a typeahead over funds and partners
function typeahead(count) {
  const input = el("input", { placeholder: count ? `Search ${count} investors` : "Search investors", "aria-label": "Search investors", role: "combobox", "aria-expanded": "false", "aria-autocomplete": "list", autocomplete: "off" });
  const list = el("div", { class: "ta-list", role: "listbox", style: "display:none" });
  let hits = [], at = -1;
  const ensure = () => { if (!window.__vcs && !window.__vcsLoading) { window.__vcsLoading = true; fetchJson("/api/pipeline").then((d) => { window.__vcs = d.vcs; window.__evidence = d.evidence; window.__peopleAll = [...(d.people || []), ...(d.contacts || [])]; }).catch(() => {}).finally(() => { window.__vcsLoading = false; }); } };
  const go = (h) => { input.value = ""; hide(); location.hash = `#/vc/${h.id}`; };
  const hide = () => { list.style.display = "none"; input.setAttribute("aria-expanded", "false"); at = -1; };
  const draw = () => {
    list.replaceChildren(...hits.map((h, i) => {
      const r = el("div", { class: "ta-item" + (i === at ? " on" : ""), role: "option", "aria-selected": String(i === at) }, el("b", {}, h.firm), h.sub ? el("span", {}, h.sub) : null);
      r.onmousedown = (e) => { e.preventDefault(); go(h); };
      return r;
    }));
    list.style.display = hits.length ? "block" : "none"; input.setAttribute("aria-expanded", String(!!hits.length));
  };
  input.oninput = () => {
    ensure();
    const q = input.value.trim().toLowerCase();
    if (!q) { hits = []; return draw(); }
    const firms = (window.__vcs || []).filter((v) => v.firm.toLowerCase().includes(q)).sort((a, b) => (b.firm.toLowerCase().startsWith(q)) - (a.firm.toLowerCase().startsWith(q)) || a.firm.localeCompare(b.firm))
      .map((v) => ({ id: v.id, firm: v.firm, sub: FIT[v.fit_level] ? FIT[v.fit_level][0] : "" }));
    const byId = new Map((window.__vcs || []).map((v) => [v.id, v.firm]));
    const people = (window.__peopleAll || []).filter((p) => p.name && p.name.toLowerCase().includes(q) && byId.has(p.vc_id)).map((p) => ({ id: p.vc_id, firm: p.name, sub: `Partner at ${byId.get(p.vc_id)}` }));
    hits = [...firms, ...people].slice(0, 8); at = hits.length ? 0 : -1; draw();
  };
  input.onfocus = ensure;
  input.onblur = () => setTimeout(hide, 120);
  input.onkeydown = (e) => {
    if (e.key === "ArrowDown" && hits.length) { e.preventDefault(); at = (at + 1) % hits.length; draw(); }
    else if (e.key === "ArrowUp" && hits.length) { e.preventDefault(); at = (at - 1 + hits.length) % hits.length; draw(); }
    else if (e.key === "Escape") { hide(); input.blur(); }
    else if (e.key === "Enter") {
      if (at >= 0 && hits[at]) { e.preventDefault(); go(hits[at]); }
      else if (input.value.trim()) { window.__q = input.value.trim(); input.value = ""; hide(); if (location.hash === "#/status") route(); else location.hash = "#/status"; }
    }
  };
  return el("div", { class: "gsearch ta" }, el("span", { "aria-hidden": "true", style: "color:var(--muted)" }, "⌕"), input, list);
}
