# Fit: is this investor a good target for Vikram's Seed round? Read by code (schema-checked in pipeline/config.py).
# Fit is a rating (high / medium / low) built from points, and it is separate from Timing (is there a fresh signal?).
# The two are never multiplied together: fit decides WHO is worth pitching, timing decides WHEN.
version: 1

# Words used to build the search query for each VC.
topic_keywords: [supply chain, logistics, freight, warehouse]

# Words that make a fund's thesis "logistics-native" (matched against the thesis text).
thesis_keywords: [supply chain, logistics, freight, warehouse, transport, mobility, shipping, trade, fleet, maritime, customs]

# Logistics companies a fund has backed before. A mention in its background counts as track record. Add your own.
logistics_portfolio: [Porter, Daakit, Delhivery, Shadowfax, Rivigo, BlackBuck, Flexport, Convoy, Project44, Locus, Zepto]

# Hard gates (any failure -> skip, and no search budget is spent on it)
require_investing: true            # vc_profile.is_investing must be true
stage_must_match_any:              # case-insensitive substring of vc_profile.stage_focus
  - pre-seed
  - seed
  - early
  - corporate                      # corporate funds sometimes write seed cheques; rated down below
hard_exclude_flags:                # case-insensitive substring of vc_profile.flag
  - not currently investing

# Points. Each distinct reason counts ONCE, so the same worry is never penalised twice.
fit_points:
  logistics_thesis: 3              # thesis is about logistics / supply chain
  seed_stage: 2                    # stage focus includes pre-seed / seed
  early_stage: 1                   # "early" only
  preferred_geo: 1                 # geography matches preferred_geos
  logistics_track_record: 1        # background mentions logistics or a logistics portfolio company
  concern: -1                      # each of concern_flags
  scale_concern: -2                # big fund / growth stage: counted once, however many ways it shows up
  conflict: -2                     # a recent signal mentions one of the competitors below
levels:                            # points needed
  high: 5
  medium: 3                        # below this: low

preferred_geos: [india, global]
growth_stage_words: [growth, late]
concern_flags: ["leans hardware", "leans deep tech", "check saas fit", "corporate"]
scale_flags: ["check seed cheque fit"]
# Data-quality flags are shown as a confidence badge. They never change the fit rating.
confidence_flags: ["verify", "low-quality source", "evidence from"]

# Names of companies that compete with yours. If a fund's recent signals mention one, it is flagged
# "possible conflict". Fill this in: it is empty because I don't know your competitors.
competitors: []
