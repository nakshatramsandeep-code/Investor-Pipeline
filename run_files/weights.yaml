# Scoring weights. Read by code (schema-checked in pipeline/config.py).
# Tune these after you have a few weeks of useful / not-useful feedback.
version: 1

signal_types:            # how strong is each kind of signal (0..1)
  portfolio_investment: 1.0
  fund_announcement: 0.9
  interview: 0.8
  blog_post: 0.7
  event_appearance: 0.6
  other: 0.3

recency:
  window_days: 30        # a signal older than this is not a signal
  half_life_days: 14     # strength halves every 14 days

bonuses:
  extra_signal: 0.10     # per additional distinct signal, up to 3 extra
  new_since_last_run: 0.10   # newest signal is newer than what Vikram was already shown
  preferred_geo: 0.05    # vc_profile.geo contains one of preferred_geos

preferred_geos: [india, global]

routing:
  waiting_nudge_days: 7        # pitched this long ago with no reply -> follow up (silence is a reason)
  reach_out_max_signal_age_days: 14   # 'reach out' needs a logistics signal at least this fresh
  reach_out_min_score: 35      # a prospect needs at least this score to be called 'reach out'
  quiet_nudge_score: 25        # score given to a "nudge" that has no new signal behind it

source_tiers:            # multiplier on a signal's strength by where it came from (0..1)
  own_site: 1.0
  news: 0.95
  social: 0.6
  unlisted: 0.5

general_content_factor: 0.3   # general interviews / blogs / events (not deals) count much less

relevance:               # multiplier by topic: logistics / supply chain activity counts most
  logistics: 1.0
  general: 0.5           # any other recent activity by the fund: still a sign it is active

schedule:                # how often to spend a search on each kind of investor (days between checks)
  pipeline_days: 2       # contacted / in talks / approved: you want fresh hooks, and there are few of them
  reach_days: 2          # reach-out and follow-up candidates
  dormant_days: 7        # everyone else: most investors, and they rarely change week to week
